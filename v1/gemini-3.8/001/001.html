<!--
  HELLO WORLD LAB — DENEY 001
  Hedef: Yalın Semantik HTML ile Başlangıç Referansı
  Yeni Teknoloji: Semantic HTML5 Belge Yapısı (<!DOCTYPE html>, <html>, <head>, <body>, <main>, <h1>)
  Önemli Önceki Teknolojiler: Yok (Laboratuvar Başlangıç Referansı)
  Çalıştırma Adresi: http://localhost:7373/001.html (Geliştirme: http://localhost:7373/001.dev.html)
-->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deney 001 — Hello World (Yalın Semantik HTML)</title>
  <!--
    Bu deneyde kasıtlı olarak hiçbir CSS stili (<style> veya style niteliği)
    ve hiçbir JavaScript kodu (<script>) kullanılmamıştır.
    Amaç: Tarayıcının varsayılan kullanıcı aracısı stil sayfası (user-agent stylesheet)
    ve saf HTML5 anlamsal etiketleri ile "Hello World" ifadesinin en temel,
    müdahalesiz başlangıç durumunu referans olarak kaydetmektir.
  -->
</head>
<body>
  <!--
    <main> etiketi, sayfanın ana ve özgün içeriğini anlamsal olarak temsil eder.
    <h1> başlığı, hiyerarşideki en üst düzey başlık olarak "Hello World" ifadesini
    belgenin mutlak odak noktası haline getirir.
  -->
  <main>
    <h1>Hello World</h1>
  </main>
</body>
</html>
