<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hello World - Deney 010 (Pointer Events API ve Elastik Dokunuş)</title>
  <style>
    /*
     * CSS Temel Sıfırlama ve Dokunmatik Eylem Yönetimi
     * touch-action: none sayesinde tarayıcının varsayılan kaydırma/yakınlaştırma
     * hareketleri engellenir ve Pointer Events doğrudan JavaScript'e aktarılır.
     */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070813;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      touch-action: none;
    }

    .hud-caption {
      position: absolute;
      top: 2rem;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
    }

    /*
     * Başlık ve Glif Konteyneri
     * Her harf bir yuva (.letter-slot) içinde bağımsız fiziksel gövdedir (.letter-body).
     */
    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .word-cluster {
      display: inline-flex;
      align-items: center;
    }

    .word-space {
      width: clamp(1.2rem, 3.5vw, 2.5rem);
    }

    .letter-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(2.4rem, 6.5vw, 4.8rem);
      height: clamp(3.5rem, 9.5vw, 6.8rem);
      position: relative;
    }

    /*
     * Fiziksel Harf Gövdesi
     * Pointer Events API ile doğrudan dinlenir ve yakalanır (setPointerCapture).
     */
    .letter-body {
      font-size: clamp(3rem, 8.5vw, 6.2rem);
      font-weight: 900;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      will-change: transform, color, text-shadow;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
      transition: color 0.15s ease;
    }

    .letter-body.dragging {
      cursor: grabbing;
      color: #f472b6;
      text-shadow: 0 0 35px rgba(244, 114, 182, 0.9), 0 0 60px rgba(168, 85, 247, 0.6);
      z-index: 50;
    }

    /*
     * Telemetri ve Kontrol Paneli (HUD)
     * Aktif işaretçi türünü, sayısını, koordinatları ve basıncı (pressure) canlı gösterir.
     */
    .telemetry-hud {
      position: absolute;
      bottom: 2.5rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
      padding: 0.85rem 1.75rem;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 20;
    }

    .telemetry-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .telemetry-value {
      color: #38bdf8;
      font-weight: 700;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <main class="stage">
    <div class="hud-caption">Deney 010 // Pointer Events API &amp; Elastik Fizik</div>

    <!--
      Semantik H1 Başlığı:
      aria-label="Hello World" ile ekran okuyuculara tek parça sunulur.
      İçerideki harfler bağımsız işaretçi yakalama (pointer capture) ve yaylanma gövdeleridir.
    -->
    <h1 class="title" aria-label="Hello World">
      <div class="word-cluster" aria-hidden="true">
        <div class="letter-slot"><span class="letter-body">H</span></div>
        <div class="letter-slot"><span class="letter-body">e</span></div>
        <div class="letter-slot"><span class="letter-body">l</span></div>
        <div class="letter-slot"><span class="letter-body">l</span></div>
        <div class="letter-slot"><span class="letter-body">o</span></div>
      </div>
      <div class="word-space" aria-hidden="true">&nbsp;</div>
      <div class="word-cluster" aria-hidden="true">
        <div class="letter-slot"><span class="letter-body">W</span></div>
        <div class="letter-slot"><span class="letter-body">o</span></div>
        <div class="letter-slot"><span class="letter-body">r</span></div>
        <div class="letter-slot"><span class="letter-body">l</span></div>
        <div class="letter-slot"><span class="letter-body">d</span></div>
      </div>
    </h1>

    <!-- İnteraktif Pointer Telemetri Paneli -->
    <nav class="telemetry-hud" aria-label="İşaretçi Telemetrisi">
      <div class="telemetry-item">
        <span>İşaretçi:</span>
        <span class="telemetry-value" id="pointerTypeDisplay">mouse (Hazır)</span>
      </div>
      <div class="telemetry-item">
        <span>Baskı (Pressure):</span>
        <span class="telemetry-value" id="pressureDisplay">0.00</span>
      </div>
      <div class="telemetry-item">
        <span>Aktif Dokunuş:</span>
        <span class="telemetry-value" id="activePointersDisplay">0</span>
      </div>
      <button type="button" class="btn" id="impulseBtn" title="Tüm Harfleri Fırlat">
        <span>💥</span>
        <span>Dağıt</span>
      </button>
    </nav>
  </main>

  <script>
    /**
     * Hello World Lab - Deney 010: Pointer Events API & Elastik Fizik
     *
     * Çalışma Mantığı:
     * 1. Her bir harf (.letter-body) bir Euler yay-sönümleyici (spring-damper) gövdesidir.
     * 2. pointerdown olayı tetiklendiğinde:
     *    - element.setPointerCapture(e.pointerId) çağrılır.
     *    - Bu sayede işaretçi hızlıca ekranın dışına veya başka bir elemanın üzerine
     *      kayarsa dahi pointermove ve pointerup olayları garantiyle bu harfe gelir.
     * 3. e.pressure (baskı) değeriyle harfin gerilimi ve ışıması dinamik ölçeklenir.
     * 4. pointerup ile harf serbest bırakıldığında, biriken yaylanma kuvvetiyle
     *    orijinal konumuna sönümlü osilasyon ile geri döner.
     * 5. Çoklu dokunmatik ekranlarda birden fazla parmak aynı anda harfleri bağımsızca yakalayabilir.
     */

    (function() {
      'use strict';

      const letterElements = Array.from(document.querySelectorAll('.letter-body'));
      const pointerTypeDisplay = document.getElementById('pointerTypeDisplay');
      const pressureDisplay = document.getElementById('pressureDisplay');
      const activePointersDisplay = document.getElementById('activePointersDisplay');
      const impulseBtn = document.getElementById('impulseBtn');

      const activePointers = new Map();

      /**
       * Tekil Harf Yaylanma Modeli (Spring Damper Physics)
       */
      class SpringLetter {
        constructor(el) {
          this.el = el;
          this.x = 0;       // Mevcut konum sapması (dx)
          this.y = 0;       // Mevcut konum sapması (dy)
          this.vx = 0;      // X ekseni hızı
          this.vy = 0;      // Y ekseni hızı
          this.stiffness = 0.085; // Yay sertliği (Geri çekme kuvveti)
          this.damping = 0.80;    // Hareket sürtünmesi / sönümleme
          this.isDragging = false;
          this.pointerId = null;
          this.startX = 0;
          this.startY = 0;
          this.lastPointerX = 0;
          this.lastPointerY = 0;
          this.pressure = 0;

          this.initEvents();
        }

        initEvents() {
          // 1. İşaretçi Dokunma / Tıklama
          this.el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.isDragging = true;
            this.pointerId = e.pointerId;
            this.startX = e.clientX - this.x;
            this.startY = e.clientY - this.y;
            this.lastPointerX = e.clientX;
            this.lastPointerY = e.clientY;
            this.pressure = e.pressure || 0.5;

            // En kritik API çağrısı: İşaretçiyi bu elemana kilitle
            try {
              this.el.setPointerCapture(e.pointerId);
            } catch (_) {}

            this.el.classList.add('dragging');
            activePointers.set(e.pointerId, { type: e.pointerType, pressure: this.pressure });
            updateTelemetry(e);
          });

          // 2. İşaretçi Hareketi
          this.el.addEventListener('pointermove', (e) => {
            if (this.isDragging && e.pointerId === this.pointerId) {
              const currentX = e.clientX - this.startX;
              const currentY = e.clientY - this.startY;

              // Bırakıldığında fırlatma momentumu için anlık hız hesabı
              this.vx = (e.clientX - this.lastPointerX) * 0.7;
              this.vy = (e.clientY - this.lastPointerY) * 0.7;
              this.lastPointerX = e.clientX;
              this.lastPointerY = e.clientY;

              this.x = currentX;
              this.y = currentY;
              this.pressure = e.pressure || 0.5;

              activePointers.set(e.pointerId, { type: e.pointerType, pressure: this.pressure });
              updateTelemetry(e);
            }
          });

          // 3. İşaretçi Bırakma / İptal
          const endDrag = (e) => {
            if (this.isDragging && e.pointerId === this.pointerId) {
              this.isDragging = false;
              this.el.classList.remove('dragging');

              try {
                if (this.el.hasPointerCapture(e.pointerId)) {
                  this.el.releasePointerCapture(e.pointerId);
                }
              } catch (_) {}

              this.pointerId = null;
              this.pressure = 0;
              activePointers.delete(e.pointerId);
              updateTelemetry(e, true);
            }
          };

          this.el.addEventListener('pointerup', endDrag);
          this.el.addEventListener('pointercancel', endDrag);
        }

        update() {
          if (!this.isDragging) {
            // Orijinal yuvasına (0, 0) doğru Hooke Kanunu: F = -k * x
            const ax = -this.stiffness * this.x;
            const ay = -this.stiffness * this.y;

            this.vx = (this.vx + ax) * this.damping;
            this.vy = (this.vy + ay) * this.damping;

            this.x += this.vx;
            this.y += this.vy;
          }

          // Transform ve Rotasyonun Uygulanması
          const rotation = this.x * 0.12;
          const stretch = 1 + Math.min(Math.sqrt(this.x * this.x + this.y * this.y) * 0.0015, 0.4);
          this.el.style.transform = `translate3d(${this.x.toFixed(2)}px, ${this.y.toFixed(2)}px, 0) rotate(${rotation.toFixed(2)}deg) scale(${stretch.toFixed(3)})`;
        }

        applyImpulse(fx, fy) {
          this.vx += fx;
          this.vy += fy;
        }
      }

      const letterBodies = letterElements.map(el => new SpringLetter(el));

      /**
       * Telemetri Göstergesini Canlı Güncelleme
       */
      function updateTelemetry(e, isEnd = false) {
        if (isEnd && activePointers.size === 0) {
          pointerTypeDisplay.textContent = 'Hazır';
          pressureDisplay.textContent = '0.00';
          activePointersDisplay.textContent = '0';
          return;
        }

        const type = e.pointerType || 'mouse';
        const pressure = (e.pressure !== undefined ? e.pressure : 0.5).toFixed(2);

        pointerTypeDisplay.textContent = `${type} (Aktif)`;
        pressureDisplay.textContent = pressure;
        activePointersDisplay.textContent = activePointers.size.toString();
      }

      /**
       * Ana Fizik Render Döngüsü (requestAnimationFrame)
       */
      function physicsLoop() {
        for (let i = 0; i < letterBodies.length; i++) {
          letterBodies[i].update();
        }
        requestAnimationFrame(physicsLoop);
      }

      // "Dağıt" Patlama Butonu
      impulseBtn.addEventListener('click', () => {
        letterBodies.forEach(letter => {
          const angle = Math.random() * Math.PI * 2;
          const force = 25 + Math.random() * 35;
          letter.applyImpulse(Math.cos(angle) * force, Math.sin(angle) * force);
        });
      });

      // Döngüyü Başlat
      requestAnimationFrame(physicsLoop);
    })();
  </script>
</body>
</html>
