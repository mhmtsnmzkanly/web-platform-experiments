<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — First Paint</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c100f;
      --ink: #f3f6e9;
      --acid: #c9ee4a;
      --muted: #7d877a;
      --paint-progress: 0.62;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent 0 49.9%, rgba(201, 238, 74, 0.08) 50%, transparent 50.1%),
        var(--bg);
    }

    main {
      width: min(1060px, calc(100vw - 64px));
      height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 26px;
      padding: 34px 0 28px;
    }

    header,
    footer {
      display: flex;
      justify-content: space-between;
      gap: 22px;
      color: var(--muted);
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    header {
      border-top: 1px solid var(--muted);
      padding-top: 12px;
    }

    header span:first-child,
    footer span:last-child {
      color: var(--acid);
    }

    header span:last-child,
    footer span:first-child {
      text-align: right;
    }

    .console {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(201, 238, 74, 0.38);
      background: rgba(201, 238, 74, 0.03);
      box-shadow: inset 0 0 70px rgba(201, 238, 74, 0.06);
    }

    .console::before,
    .console::after {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: var(--acid);
      border-style: solid;
      content: "";
    }

    .console::before {
      top: 24px;
      left: 24px;
      border-width: 2px 0 0 2px;
    }

    .console::after {
      right: 24px;
      bottom: 24px;
      border-width: 0 2px 2px 0;
    }

    .readout {
      position: absolute;
      top: 28px;
      right: 46px;
      left: 46px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-family: "Courier New", monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .readout::after {
      position: absolute;
      top: 22px;
      right: 0;
      left: 0;
      height: 1px;
      background: rgba(201, 238, 74, 0.24);
      content: "";
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--ink);
      font-size: clamp(62px, 13.2vw, 178px);
      font-weight: 900;
      letter-spacing: -0.1em;
      line-height: 0.86;
      text-align: center;
      text-shadow: 7px 7px 0 rgba(201, 238, 74, 0.18);
    }

    .baseline {
      position: absolute;
      right: 12%;
      bottom: 23%;
      left: 12%;
      height: 3px;
      background: rgba(201, 238, 74, 0.2);
    }

    .baseline::before {
      display: block;
      width: calc(var(--paint-progress) * 100%);
      height: 100%;
      background: var(--acid);
      box-shadow: 0 0 16px var(--acid);
      content: "";
    }

    footer {
      border-bottom: 1px solid rgba(125, 135, 122, 0.65);
      padding-bottom: 12px;
    }

    @media (max-width: 640px) {
      main {
        width: calc(100vw - 28px);
        padding-top: 22px;
      }

      header,
      footer {
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span>010 / FIRST PAINT</span>
      <span>PERFORMANCE OBSERVER / TIMING</span>
    </header>

    <section class="console" aria-label="Hello World first paint measurement">
      <div class="readout">
        <span id="paint-label">PAINT / WAITING</span>
        <span>THE BROWSER DREW THIS</span>
      </div>
      <h1>Hello World</h1>
      <div class="baseline" aria-hidden="true"></div>
    </section>

    <footer>
      <span>MEASURE THE MOMENT OF APPEARANCE</span>
      <span>LIVE / <strong>PAINT SIGNAL</strong></span>
    </footer>
  </main>

  <script>
    (() => {
      if (!("PerformanceObserver" in window)) {
        throw new Error("PerformanceObserver is unavailable.");
      }

      const root = document.documentElement;
      const label = document.getElementById("paint-label");
      let applied = false;

      function applyPaint(entry) {
        if (applied || !entry) {
          return;
        }
        applied = true;
        const milliseconds = Math.max(0, entry.startTime);
        const progress = Math.min(0.96, Math.max(0.32, 0.38 + (milliseconds % 120) / 180));
        root.style.setProperty("--paint-progress", progress.toFixed(3));
        label.textContent = `PAINT / ${milliseconds.toFixed(2)} MS`;
      }

      const observer = new PerformanceObserver((list) => {
        const entry = list.getEntries().find((item) => item.name === "first-paint");
        applyPaint(entry || list.getEntries()[0]);
      });
      observer.observe({ type: "paint", buffered: true });

      const existing = performance.getEntriesByType("paint");
      applyPaint(existing.find((entry) => entry.name === "first-paint") || existing[0]);
    })();
  </script>
</body>
</html>
