<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Moving Print</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #e8dfcb;
      color: #141414;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(219, 92, 73, 0.16), transparent 28%),
        radial-gradient(circle at 88% 84%, rgba(33, 74, 155, 0.16), transparent 32%),
        #e8dfcb;
    }

    main {
      width: min(1160px, calc(100vw - 56px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 22px;
      padding: 32px 0 28px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 30px;
      border-top: 3px solid #141414;
      padding-top: 12px;
    }

    .kicker,
    .edition {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .kicker {
      color: #214a9b;
    }

    .edition {
      color: #db5c49;
      text-align: right;
    }

    .poster {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 2px solid #141414;
      background: #f4eddd;
      box-shadow: 12px 12px 0 #214a9b;
    }

    .poster::before {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(20, 20, 20, 0.25);
      content: "";
      pointer-events: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 460px;
    }

    .caption {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: #141414;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .caption span:last-child {
      color: #214a9b;
      text-align: right;
    }

    @media (max-width: 640px) {
      main {
        width: calc(100vw - 28px);
        padding-top: 20px;
      }

      header {
        gap: 14px;
      }

      .kicker,
      .edition,
      .caption {
        font-size: 9px;
      }

      .poster {
        box-shadow: 7px 7px 0 #214a9b;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">03 / Moving Print</p>
      <p class="edition">A study in living ink<br>SVG / SMIL / 2026</p>
    </header>

    <section class="poster" aria-label="Hello World moving print poster">
      <svg viewBox="0 0 1200 620" role="img" aria-labelledby="poster-title poster-description">
        <title id="poster-title">Hello World</title>
        <desc id="poster-description">A moving print texture is applied to the words Hello World.</desc>
        <defs>
          <filter id="ink-shift" x="-10%" y="-20%" width="120%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.028" numOctaves="2" seed="7" result="paper-noise">
              <animate attributeName="baseFrequency" values="0.012 0.028;0.018 0.036;0.012 0.028" dur="9s" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="paper-noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="soft-ink" x="-10%" y="-20%" width="120%" height="140%">
            <feGaussianBlur stdDeviation="1.5"/>
          </filter>
        </defs>

        <g opacity="0.16" fill="#db5c49" filter="url(#soft-ink)" transform="translate(12 10)">
          <text x="600" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="154" font-weight="900" letter-spacing="-8">Hello World</text>
        </g>
        <g fill="#214a9b" opacity="0.92" transform="translate(-8 4)">
          <text x="600" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="154" font-weight="900" letter-spacing="-8">Hello World</text>
        </g>
        <g fill="#141414" filter="url(#ink-shift)">
          <text x="600" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="154" font-weight="900" letter-spacing="-8">Hello World</text>
        </g>

        <g fill="none" stroke="#141414" stroke-width="2">
          <path d="M124 146H344"/>
          <path d="M856 478H1076"/>
        </g>
        <g fill="#db5c49">
          <circle cx="124" cy="146" r="7"/>
          <circle cx="1076" cy="478" r="7"/>
        </g>
        <g fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">
          <text x="124" y="124">THE WORD IS A SURFACE</text>
          <text x="856" y="510">PRINT / MOTION / MEANING</text>
        </g>
      </svg>
    </section>

    <footer class="caption">
      <span>One phrase, never quite still.</span>
      <span>FE TURBULENCE → DISPLACEMENT → HELLO WORLD</span>
    </footer>
  </main>
</body>
</html>
