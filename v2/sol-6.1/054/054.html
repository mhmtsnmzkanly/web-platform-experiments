<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Proof Sheet</title><style>body{margin:0;background:#e5a28e}main{height:100vh;display:grid;place-items:center}canvas{width:1150px;max-width:95vw}</style></head><body><main><canvas width="1150" height="650" aria-label="Hello World decoded from a generated PNG">Hello World</canvas></main><script>
let evidence={};
// An opaque source avoids premultiplied-alpha rounding ambiguity. Only the
// decoded PNG, not the source canvas, is used for the visible proof.
window.labReady=(async()=>{const source=document.createElement('canvas');source.width=1150;source.height=650;const ctx=source.getContext('2d');ctx.fillStyle='#e5a28e';ctx.fillRect(0,0,1150,650);ctx.fillStyle='#352b2c';ctx.font='100px Georgia';for(let i=0;i<3;i++)ctx.fillText('Hello World',70+i*130,160+i*180);
const blob=await new Promise((resolve,reject)=>source.toBlob(value=>value?resolve(value):reject(new Error('PNG encoding failed')),'image/png'));const header=new Uint8Array(await blob.slice(0,8).arrayBuffer()),url=URL.createObjectURL(blob),image=new Image();image.src=url;await image.decode();const out=document.querySelector('canvas').getContext('2d');out.drawImage(image,0,0);URL.revokeObjectURL(url);const a=ctx.getImageData(0,0,1150,650).data,b=out.getImageData(0,0,1150,650).data;let differences=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])differences++;evidence={bytes:blob.size,type:blob.type,signature:[...header],width:image.naturalWidth,height:image.naturalHeight,differences}})();
window.labEvidence=()=>({subject:'Hello World',passed:evidence.type==='image/png'&&evidence.width===1150&&evidence.height===650&&evidence.differences===0&&evidence.signature.join(',')==='137,80,78,71,13,10,26,10',mechanism:'Canvas PNG encoding -> image.decode -> pixel-equal greeting proof',measurements:evidence});
</script></body></html>
