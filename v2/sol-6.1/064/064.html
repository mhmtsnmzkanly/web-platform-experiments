<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Two Sides</title><style>body{margin:0;background:#e9ddc9;color:#314136}main{padding:60px 90px}button{font:18px Georgia;padding:14px 22px;background:#314136;color:#f4ecd8;border:0}#stage{perspective:1200px;margin-top:120px}#sheet{width:1050px;height:380px;transform-style:preserve-3d;transform:rotateY(-20deg);position:relative}body.turned #sheet{transform:rotateY(160deg)}.face{position:absolute;inset:0;backface-visibility:hidden;display:grid;place-items:center;background:#ddb657}.back{transform:rotateY(180deg);background:#aac09d}h1{font:120px Arial;margin:0;font-weight:bold}.back h1{font:italic 145px Georgia}</style></head><body><main><button id="turn">Turn the sheet</button><div id="stage"><div id="sheet"><section class="face front"><h1>Hello World</h1></section><section class="face back"><h1>Hello World</h1></section></div></div></main><script>
// Both faces occupy the same geometry. Native backface visibility determines
// which one paints and receives hit tests; opacity/display are never toggled.
function face(){const rect=document.querySelector('#sheet').getBoundingClientRect();return document.elementFromPoint(rect.left+rect.width/2,rect.top+rect.height/2)?.closest('.face')?.className}
document.querySelector('#turn').onclick=()=>document.body.classList.add('turned');
window.labEvidence=()=>({subject:'Hello World',passed:face()==='face front'&&getComputedStyle(document.querySelector('.back')).backfaceVisibility==='hidden',mechanism:'Native backface culling -> visible greeting face',measurements:{hitFace:face()}});
window.labScenario={kind:'click',selector:'#turn'};
window.labInteractionEvidence=()=>({subject:'Hello World',passed:face()==='face back'&&getComputedStyle(document.querySelector('.front')).display==='grid',mechanism:'3D half-turn -> backface exclusion -> alternate greeting face',measurements:{hitFace:face(),transform:getComputedStyle(document.querySelector('#sheet')).transform}});
</script></body></html>
