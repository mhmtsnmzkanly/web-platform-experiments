<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Measured Arc</title><style>body{margin:0;background:#e3e5df}main{height:100vh;display:grid;place-items:center}svg{width:1180px;max-width:96vw}text{font:76px Georgia;fill:#925839;text-anchor:middle}path{stroke:#92583944;stroke-width:1;fill:none}</style></head><body><main><svg viewBox="0 0 1180 650" role="img" aria-label="Hello World with individually measured path tangents"><path id="arc" d="M100 450 C300 80 880 80 1080 450"/></svg></main><script>
