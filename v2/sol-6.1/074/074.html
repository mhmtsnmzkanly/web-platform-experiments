<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Fit the Proof</title><style>body{margin:0;background:#dec5a5;color:#3c4f58}main{padding:55px 90px}label{font:20px Georgia}input{accent-color:#3c4f58}h1{font:64px Georgia;font-weight:400;margin:35px 0}img{display:block;width:1000px;height:360px;object-fit:contain;object-position:center;background:#bca88e}body:has(input:checked) img{object-fit:cover}</style></head><body><main><label><input id="cover" type="checkbox">Cover the frame — deliberately crop the proof</label><h1>Hello World</h1><img alt="Generated Hello World proof: contain preserves, cover crops"></main><script>
const image=document.querySelector('img');
// A generated tall proof has a different intrinsic ratio from its frame.
// CSS alone chooses letterboxing or cropping; no canvas redraw follows input.
window.labReady=(async()=>{const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=600;const ctx=canvas.getContext('2d');ctx.fillStyle='#3c4f58';ctx.fillRect(0,0,1200,600);ctx.fillStyle='#cfdac1';ctx.font='bold 160px Georgia';ctx.fillText('Hello',140,135);ctx.fillText('World',500,560);const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('Proof encoding failed'))));const url=URL.createObjectURL(blob);image.src=url;await image.decode();URL.revokeObjectURL(url)})();
function state(){const rect=image.getBoundingClientRect(),fit=getComputedStyle(image).objectFit,scale=(fit==='contain'?Math.min:Math.max)(rect.width/image.naturalWidth,rect.height/image.naturalHeight);return {fit,box:[rect.width,rect.height],intrinsic:[image.naturalWidth,image.naturalHeight],expectedPaint:[image.naturalWidth*scale,image.naturalHeight*scale]}}
window.labEvidence=()=>({subject:'Hello World',passed:state().fit==='contain'&&state().intrinsic.join(',')==='1200,600'&&state().expectedPaint.join(',')==='720,360',mechanism:'Intrinsic greeting ratio -> object-fit contain -> complete proof',measurements:state()});
window.labScenario={kind:'click',selector:'#cover'};
window.labInteractionEvidence=()=>({subject:'Hello World',passed:state().fit==='cover'&&state().box.join(',')==='1000,360'&&state().expectedPaint.join(',')==='1000,500',mechanism:'Native object-fit cover -> over-height image -> deliberate greeting crop',measurements:state()});
</script></body></html>
