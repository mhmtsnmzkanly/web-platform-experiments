<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Annotation</title>
<style>
body{margin:0;background:#e9e0f0;color:#422846;font-family:Georgia,serif}main{padding:70px 7vw}header{font:12px Arial,sans-serif;letter-spacing:3px}h1{font-size:clamp(65px,11vw,145px);font-weight:normal;letter-spacing:-7px;margin:170px 0 25px;line-height:1.3}
/* Highlight paints a Range over the original text node. It does not need
   span wrappers, selection focus, or changes to the semantic heading. */
::highlight(annotation){background-color:#c9ec6b;color:#422846}
.lines{height:100px;border-top:1px solid;background:repeating-linear-gradient(transparent 0 32px,#b49dbd 32px 33px)}
button{margin-top:35px;padding:13px 22px;background:#422846;color:#e9e0f0;border:0;font:14px Arial,sans-serif;cursor:pointer}
small{display:block;margin-top:18px;font:13px monospace}
</style></head><body><main><header>011 / ANNOTATION WITHOUT WRAPPERS</header><h1>Hello World</h1><div class="lines" aria-hidden="true"></div><button id="move">Move the highlighter</button><small id="note">Range [0, 5): Hello</small></main>
<script>
const heading=document.querySelector('h1'),node=heading.firstChild;let current;
function mark(start,end){current=new Range();current.setStart(node,start);current.setEnd(node,end);CSS.highlights.set('annotation',new Highlight(current));document.querySelector('#note').textContent='Range ['+start+', '+end+'): '+current.toString()}
mark(0,5);
document.querySelector('#move').onclick=()=>mark(current.startOffset===0?6:0,current.startOffset===0?11:5);
window.labScenario={kind:'click',selector:'#move'};
window.labEvidence=()=>({subject:'Hello World',passed:CSS.highlights.has('annotation')&&current.toString()==='Hello'&&heading.childNodes.length===1,
mechanism:'Text offsets -> Range -> Custom Highlight -> word emphasis',measurements:{rangeText:current.toString(),registrySize:CSS.highlights.size,childNodes:heading.childNodes.length}});
window.labInteractionEvidence=()=>({subject:'Hello World',passed:current.toString()==='World'&&current.startOffset===6&&heading.firstChild===node&&heading.childNodes.length===1,
mechanism:'Trusted click -> new range offsets -> highlight moves without DOM restructuring',measurements:{rangeText:current.toString(),start:current.startOffset,end:current.endOffset,sameTextNode:heading.firstChild===node}});
</script></body></html>
