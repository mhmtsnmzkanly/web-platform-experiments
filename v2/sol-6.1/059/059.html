<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Initial</title><style>body{margin:0;background:#ede2cc;color:#654332}main{padding:140px 120px}p{font:38px/1.45 Georgia;width:950px;margin:0}p::first-letter{float:left;initial-letter:3;color:#b24e35;padding-right:20px;font-weight:bold}</style></head><body><main><p></p></main><script>
const paragraph=document.querySelector('p');paragraph.textContent=('Hello World ').repeat(34).trim();
// Native initial-letter determines cap size and exclusion across text lines;

window.labEvidence=()=>{const node=paragraph.firstChild,lines=new Map(),left=paragraph.getBoundingClientRect().left;for(const match of paragraph.textContent.matchAll(/\S+/g)){if(match.index===0)continue;const range=document.createRange();range.setStart(node,match.index);range.setEnd(node,match.index+match[0].length);const rect=range.getBoundingClientRect(),key=Math.round(rect.top);lines.set(key,Math.min(lines.get(key)??Infinity,rect.left))}const edges=[...lines.values()];return {subject:'Hello World',passed:CSS.supports('initial-letter','3')&&edges.length>4&&edges.slice(0,3).every(x=>x>left+50)&&Math.abs(edges[3]-left)<1,mechanism:'Native initial-letter -> three-line cap exclusion -> greeting field',measurements:{edges,left,initialLetter:getComputedStyle(paragraph,'::first-letter').initialLetter}}};
</script></body></html>
