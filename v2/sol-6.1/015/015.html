<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Refraction</title>
<style>
body{margin:0;background:#c7e6e0;color:#135363;font-family:Arial,sans-serif}main{height:100vh;display:flex;align-items:center;justify-content:center}
header{position:absolute;top:45px;left:55px;font-size:12px;letter-spacing:3px}svg{width:95vw;height:70vh}text{font:bold 145px Georgia,serif;fill:#135363;letter-spacing:-4px;filter:url(#ripple)}
button{position:absolute;bottom:55px;left:55px;border:1px solid;background:transparent;color:inherit;padding:14px 26px;border-radius:30px;font:14px Arial,sans-serif;cursor:pointer}
small{position:absolute;bottom:67px;right:55px;font:13px monospace}
</style></head><body><main><header>015 / REFRACTION</header>
<svg viewBox="0 0 1200 550" role="img" aria-label="Hello World refracted by a generated water-like noise field">
<defs>
<!-- A seeded native noise field feeds displacement of SourceGraphic itself.
     Enlarged bounds retain displaced edge pixels; no image texture is loaded. -->
<filter id="ripple" x="-15%" y="-40%" width="130%" height="180%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.008 0.055" numOctaves="2" seed="9" result="noise"/>
<feDisplacementMap id="map" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
</filter></defs><text x="600" y="310" text-anchor="middle">Hello World</text>
</svg><button id="refract">Disturb / settle the surface</button><small id="state">DISPLACEMENT / 0 PX</small></main>
<script>
const map=document.querySelector('#map'),text=document.querySelector('text'),noise=document.querySelector('feTurbulence');let disturbed=false;
document.querySelector('#refract').onclick=()=>{disturbed=!disturbed;map.setAttribute('scale',disturbed?'48':'0');document.querySelector('#state').textContent='DISPLACEMENT / '+map.scale.baseVal+' PX'};
window.labScenario={kind:'click',selector:'#refract'};
window.labEvidence=()=>({subject:'Hello World',passed:map.scale.baseVal===0&&noise.seed.baseVal===9&&text.getNumberOfChars()===11,
mechanism:'Seeded turbulence -> displacement map -> refracted Hello World',measurements:{scale:map.scale.baseVal,seed:noise.seed.baseVal,characters:text.getNumberOfChars(),filter:getComputedStyle(text).filter}});
window.labInteractionEvidence=()=>({subject:'Hello World',passed:disturbed&&map.scale.baseVal===48&&map.getAttribute('in')==='SourceGraphic'&&map.getAttribute('in2')===noise.getAttribute('result')&&getComputedStyle(text).filter.includes('#ripple'),
mechanism:'Trusted disturbance -> displacement scale -> filtered glyph deformation',measurements:{scale:map.scale.baseVal,source:map.getAttribute('in'),noiseInput:map.getAttribute('in2'),filter:getComputedStyle(text).filter,seed:noise.seed.baseVal}});
</script></body></html>
