<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Signed Ink</title><style>body{margin:0;background:#e6dec5;color:#3a624d}main{padding:65px 100px}button{padding:15px 22px;background:#3a624d;color:#f2ecd4;border:0;font:18px Georgia}output{display:block;font:20px Georgia;margin-top:25px}h1{font:170px/1.1 Georgia;font-weight:400;margin:65px 0 0}span{display:block}body.rejected h1{color:#a34739;font-style:italic;text-decoration:line-through;text-decoration-thickness:3px}</style></head><body><main><button id="verify">Verify altered bytes</button><output>Preparing local signature</output><h1><span>Hello</span> <span>World</span></h1></main><script>
const bytes=new TextEncoder().encode('Hello World');let key,signature,originalValid=false,alteredValid=null;
// A fresh in-memory demonstration key authenticates only this local byte
// sequence. It is not a certificate, identity or stored production secret.
window.labReady=(async()=>{key=await crypto.subtle.generateKey({name:'HMAC',hash:'SHA-256'},false,['sign','verify']);signature=await crypto.subtle.sign('HMAC',key,bytes);originalValid=await crypto.subtle.verify('HMAC',key,signature,bytes);if(!originalValid)throw new Error('Original signature failed');document.querySelector('output').textContent='Original greeting bytes accepted'})();
document.querySelector('#verify').onclick=async()=>{const altered=bytes.slice();altered[10]^=1;alteredValid=await crypto.subtle.verify('HMAC',key,signature,altered);if(alteredValid)throw new Error('Altered bytes unexpectedly accepted');document.body.classList.add('rejected');document.querySelector('output').textContent='Altered greeting bytes rejected'};
window.labEvidence=()=>({subject:'Hello World',passed:originalValid&&signature.byteLength===32,mechanism:'Generated HMAC key -> signed greeting bytes -> accepted ink',measurements:{originalValid,signatureBytes:signature.byteLength}});
window.labScenario={kind:'click',selector:'#verify'};
window.labInteractionEvidence=()=>({subject:'Hello World',passed:originalValid&&alteredValid===false&&document.body.classList.contains('rejected'),mechanism:'Altered byte verification -> false result -> cancelled greeting ink',measurements:{originalValid,alteredValid,unchangedSubject:document.querySelector('h1').textContent}});
</script></body></html>
