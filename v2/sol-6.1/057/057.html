<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Delivered Score</title><style>body{margin:0;background:#223145;color:#b6d9e4}main{padding:300px 90px}h1{font:100px Georgia;font-weight:400;white-space:nowrap;margin:0}span{display:inline-block;width:90px;text-align:center}</style></head><body><main><h1></h1></main><script>
const channel=new MessageChannel(),score=new Float32Array(11);for(let i=0;i<11;i++)score[i]=Math.sin(i*Math.PI/5)*90;let detached=false,received=[];
// Unlike broadcast, this private port pair transfers ownership of one layout
// buffer. Rendering consumes the delivered object, never the sender's array.
window.labReady=new Promise((resolve,reject)=>{channel.port2.onmessageerror=()=>reject(new Error('Score transfer failed'));channel.port2.onmessage=event=>{const offsets=new Float32Array(event.data.buffer);received=[...offsets];[...event.data.phrase].forEach((char,i)=>{const node=document.createElement('span');node.textContent=char;node.style.transform=`translateY(${offsets[i]}px)`;document.querySelector('h1').append(node)});channel.port1.close();channel.port2.close();resolve()};channel.port1.postMessage({phrase:'Hello World',buffer:score.buffer},[score.buffer]);detached=score.byteLength===0});
window.labEvidence=()=>({subject:'Hello World',passed:detached&&received.length===11&&received[2]>80&&received[7]<-80&&document.querySelector('h1').textContent==='Hello World',mechanism:'MessageChannel ownership transfer -> delivered offsets -> greeting wave',measurements:{detached,received}});
</script></body></html>
