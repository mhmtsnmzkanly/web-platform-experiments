<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Reading Notes</title><style>body{margin:0;background:#f2eee5;color:#b6473c}main{padding:130px 100px}h1{font:110px Georgia;font-weight:400;margin:0 0 120px}h1:last-child{margin-left:230px;color:#333d3b}rt{font:22px monospace;letter-spacing:5px;color:#777467}#under{ruby-position:under}</style></head><body><main><h1><ruby id="over"><span>Hello World</span><rt>spoken greeting</rt></ruby></h1><h1><ruby id="under"><span>Hello World</span><rt>written greeting</rt></ruby></h1></main><script>
// Ruby keeps annotations associated with the entire base run; they are not
// absolutely positioned labels that would lose their relationship on reflow.
window.labEvidence=()=>{const records=['over','under'].map(id=>{const ruby=document.getElementById(id),base=ruby.querySelector('span').getBoundingClientRect(),note=ruby.querySelector('rt').getBoundingClientRect();return {id,baseTop:base.top,baseBottom:base.bottom,noteTop:note.top,noteBottom:note.bottom,centerDelta:(note.top+note.bottom-base.top-base.bottom)/2}});return {subject:'Hello World',passed:records[0].centerDelta<-30&&records[1].centerDelta>30,mechanism:'Ruby base association -> native over/under annotation layout',measurements:{records}}};
</script></body></html>
