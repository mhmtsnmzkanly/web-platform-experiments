/* The limit stops the rule at a nested subtree without needing stronger
   selectors or a shadow boundary. All three headings share one document. */
@scope (.edition) to (.limit){h1{font:105px Georgia;color:#b04739}}
.limit{margin:100px 0 0 180px}.limit h1{font-style:italic}.unscoped{margin:100px 0 0 370px}
</style></head><body><main><section class="edition"><h1 id="eligible">Hello World</h1><div class="limit"><h1 id="limited">Hello World</h1></div></section><h1 class="unscoped" id="outside">Hello World</h1></main><script>

</script></body></html>
