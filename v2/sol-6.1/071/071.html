<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Two Color Paths</title><style>body{margin:0;background:#1d2429;color:#b9c6c8}main{padding:110px 90px}small{font:18px monospace}h1{font:95px monospace;font-weight:400;margin:35px 0 85px;white-space:nowrap}span{display:inline-block;width:90px}</style></head><body><main><small>sRGB interpolation</small><h1 id="srgb"></h1><small>OKLab interpolation</small><h1 id="oklab"></h1></main><script>
// Native color spaces choose the path between the same endpoints. Position
// controls each glyph's mixture; no JavaScript color conversion substitutes.
for(const space of ['srgb','oklab'])[...'Hello World'].forEach((char,i)=>{const span=document.createElement('span');span.textContent=char;span.style.color=`color-mix(in ${space}, #003fff ${100-i*10}%, #ffd500)`;document.getElementById(space).append(span)});
function pixel(space){const color=getComputedStyle(document.getElementById(space).children[4]).color,canvas=document.createElement('canvas');canvas.width=canvas.height=1;const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.fillRect(0,0,1,1);return {color,rgb:[...ctx.getImageData(0,0,1,1).data].slice(0,3)}}
window.labEvidence=()=>{const srgb=pixel('srgb'),oklab=pixel('oklab'),difference=Math.hypot(...srgb.rgb.map((v,i)=>v-oklab.rgb[i]));return {subject:'Hello World',passed:difference>15&&['srgb','oklab'].every(id=>document.getElementById(id).textContent==='Hello World'),mechanism:'Glyph position -> native color-mix space -> greeting ink spectrum',measurements:{srgb,oklab,difference}}};
</script></body></html>
