<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Passage</title><style>body{margin:0;background:#c9ccd8;color:#384c73}#viewport{margin:70px 80px;height:600px;width:1100px;overflow-y:auto;overflow-x:hidden;border-left:4px solid #7a839d}.before{height:300px}.after{height:900px}h1{font:110px/150px Georgia;font-weight:400;margin:0 0 0 55px;transform-origin:left center;animation:passage linear both;animation-timeline:view(block);animation-range:cover 0% cover 100%}@keyframes passage{from{transform:scale(.7);color:#7a839d}to{transform:scale(1.3);color:#263e72}}</style></head><body><main id="viewport"><div class="before"></div><h1>Hello World</h1><div class="after"></div></main><script>
const heading=document.querySelector('h1'),viewport=document.querySelector('#viewport');let initial;
// This timeline measures this subject's passage through its scrollport, rather
// than the scroll container's total offset as in a ScrollTimeline specimen.
function state(){const animation=heading.getAnimations()[0];return {scale:new DOMMatrix(getComputedStyle(heading).transform).a,timeline:animation.timeline.constructor.name,progress:animation.timeline.currentTime?.value,scrollTop:viewport.scrollTop}}
window.labEvidence=()=>{const now=state();initial??=now;return {subject:'Hello World',passed:now.timeline==='ViewTimeline'&&now.scale>.7&&now.scale<1.3,mechanism:'Subject passage -> native ViewTimeline -> greeting scale/color',measurements:now}};
window.labScenario={kind:'scroll',selector:'#viewport',deltaY:240};
window.labInteractionEvidence=()=>{const after=state();return {subject:'Hello World',passed:after.scrollTop>200&&after.scale>initial.scale+.1&&after.progress>initial.progress,mechanism:'Trusted wheel -> advanced subject passage -> larger greeting',measurements:{initial,after}}};
</script></body></html>
