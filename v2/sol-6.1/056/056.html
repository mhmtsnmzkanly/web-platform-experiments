<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello World — Byte Weight</title><style>body{margin:0;background:#c9d3cd;color:#304854}main{padding:170px 90px}h1{font:110px monospace;white-space:nowrap;margin:0}h1 span{display:inline-block;width:90px}section{display:grid;grid-template-columns:repeat(11,90px);margin-top:55px}article{display:flex;flex-direction:column;gap:8px;align-items:center}i{width:50px;height:18px;background:#a5b9b5}i.on{background:#304854}</style></head><body><main><h1></h1><section aria-label="Eight-bit columns for greeting bytes"></section></main><script>
const buffer=new ArrayBuffer(11),view=new DataView(buffer),records=[];
// DataView owns the encoded storage/readback. Bit population changes actual
// glyph weight, not just the metadata below the greeting.
[...'Hello World'].forEach((char,i)=>view.setUint8(i,char.charCodeAt(0)));
for(let i=0;i<11;i++){const value=view.getUint8(i),bits=value.toString(2).padStart(8,'0'),ones=[...bits].filter(bit=>bit==='1').length,span=document.createElement('span');span.textContent=String.fromCharCode(value);span.style.fontWeight=ones>=4?'bold':'normal';document.querySelector('h1').append(span);const column=document.createElement('article');for(const bit of bits){const cell=document.createElement('i');if(bit==='1')cell.className='on';column.append(cell)}document.querySelector('section').append(column);records.push({value,bits,ones})}
window.labEvidence=()=>({subject:'Hello World',passed:document.querySelector('h1').textContent==='Hello World'&&view.byteLength===11&&records[0].value===72&&records[5].value===32&&document.querySelectorAll('i').length===88,mechanism:'DataView byte readback -> bit population -> glyph weight',measurements:{byteLength:view.byteLength,records}});
</script></body></html>
