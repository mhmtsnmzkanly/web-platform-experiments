<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — CSS Subgrid Lockup</title>
  <style>
    /*
      EXPERIMENT 002: CSS Grid & Subgrid Modular Typographic Lockup

      Architecture:
      The parent grid establishes an asymmetric 6-column modular structure.
      The H1 element spans all 6 columns and establishes a subgrid:
      `grid-template-columns: subgrid`.
      "Hello" occupies the first 4 columns, and "World" occupies columns 3 through 6.
      This produces an intentional typographic overlap in columns 3 and 4,
      demonstrating track inheritance across independent grid items.

      Design System:
      - Style: Swiss International Typographic Style (Josef Müller-Brockmann inspired)
      - Palette: Archival warm cream (#f5f2eb), deep carbon black (#121314), cadmium vermilion (#e63946)
      - Typography: High-contrast geometric system grotesque sans-serif
    */

    :root {
      --bg-canvas: #f5f2eb;
      --color-ink: #121314;
      --color-vermilion: #e63946;
      --color-rule: #d0c9bc;
      --color-muted: #5e6268;
      --grid-gap: 20px;
      --grid-columns: 6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--color-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Main Poster Canvas */
    .poster-sheet {
      width: 100%;
      max-width: 1120px;
      background: var(--bg-canvas);
      border: 3px solid var(--color-ink);
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 36px;
      box-shadow: 14px 14px 0 var(--color-ink);
    }

    /* Parent Grid establishing the 6-track coordinate system */
    .parent-grid {
      display: grid;
      grid-template-columns: repeat(var(--grid-columns), minmax(0, 1fr));
      gap: var(--grid-gap);
      width: 100%;
    }

    /* Track indicator line demonstrating the shared structural columns */
    .grid-indicator-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: subgrid;
      border-bottom: 2px solid var(--color-ink);
      padding-bottom: 12px;
    }

    .track-num {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      border-left: 2px solid var(--color-ink);
      padding-left: 8px;
    }

    /*
      The central subject: H1 spans the full parent width and inherits
      its column tracks directly using `grid-template-columns: subgrid`.
    */
    h1.subject-lockup {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: subgrid;
      row-gap: 20px;
      align-items: baseline;
      margin: 0;
      padding: 16px 0;
    }

    /* "Hello" spans tracks 1 through 4 */
    .hello-word {
      grid-column: 1 / span 4;
      font-size: clamp(68px, 12vw, 140px);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--color-ink);
      border-bottom: 8px solid var(--color-ink);
      padding-bottom: 12px;
    }

    /* "World" shifts into tracks 3 through 6, locking to track 3 */
    .world-word {
      grid-column: 3 / span 4;
      font-size: clamp(68px, 12vw, 140px);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--color-vermilion);
      border-bottom: 8px solid var(--color-vermilion);
      padding-bottom: 12px;
    }

    /* Subgrid Annotation Row: spans 1 / -1 and also uses subgrid */
    .annotation-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: subgrid;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 600;
      color: var(--color-muted);
    }

    .annotation-left {
      grid-column: 1 / span 2;
      border-top: 2px solid var(--color-ink);
      padding-top: 10px;
    }

    .annotation-right {
      grid-column: 5 / span 2;
      border-top: 2px solid var(--color-vermilion);
      color: var(--color-vermilion);
      padding-top: 10px;
    }

    /* Footer structural summary */
    .poster-footer {
      border-top: 2px solid var(--color-ink);
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
  </style>
</head>
<body>
  <main class="poster-sheet">
    <div class="parent-grid">
      <!-- Track coordinate headers -->
      <div class="grid-indicator-row" aria-hidden="true">
        <span class="track-num">COL 01</span>
        <span class="track-num">COL 02</span>
        <span class="track-num">COL 03</span>
        <span class="track-num">COL 04</span>
        <span class="track-num">COL 05</span>
        <span class="track-num">COL 06</span>
      </div>

      <!-- The Primary Subject: Hello World rendered via subgrid coordination -->
      <h1 class="subject-lockup"><span class="hello-word">Hello</span> <span class="world-word">World</span></h1>

      <!-- Structural grid annotations inheriting column lines -->
      <div class="annotation-row" aria-hidden="true">
        <div class="annotation-left">
          TRACK INHERITANCE<br>
          COLUMNS 01–04 ANCHOR
        </div>
        <div class="annotation-right">
          OFFSET STEP ALIGNMENT<br>
          COLUMNS 03–06 TERMINATION
        </div>
      </div>
    </div>

    <footer class="poster-footer">
      <span>EXPERIMENT 002</span>
      <span>WEB PLATFORM SPEC: CSS SUBGRID</span>
      <span>6-COLUMN MODULAR SYSTEM</span>
    </footer>
  </main>

  <script>
    // Runtime layout verification evidence measuring subgrid coordinates
    window.labEvidence = () => {
      const hello = document.querySelector('.hello-word').getBoundingClientRect();
      const world = document.querySelector('.world-word').getBoundingClientRect();
      const parent = document.querySelector('.parent-grid').getBoundingClientRect();

      const subgridSupported = CSS.supports('grid-template-columns', 'subgrid');
      const aligned = world.left > hello.left && world.right > hello.right;

      return {
        subject: 'Hello World',
        passed: subgridSupported && aligned && hello.width > 0 && world.width > 0,
        mechanism: 'CSS Grid parent tracks -> subgrid column inheritance -> offset typographic lockup',
        measurements: {
          subgridSupported,
          parentWidth: Math.round(parent.width),
          helloWidth: Math.round(hello.width),
          worldWidth: Math.round(world.width),
          worldOffsetLeft: Math.round(world.left - parent.left)
        }
      };
    };
  </script>
</body>
</html>
