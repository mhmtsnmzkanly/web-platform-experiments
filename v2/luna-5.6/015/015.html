<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Negative Space</title>
  <style>
    :root {
      background: #f3ead8;
      color: #5b2632;
      font-family: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3ead8;
    }

    .page {
      width: min(90vw, 1080px);
      min-height: 560px;
      padding: 42px 50px 48px;
      border: 1px solid #5b2632;
      background: #fff8e9;
    }

    .label {
      margin: 0 0 34px;
      color: #b75c43;
      font: 12px/1.2 monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .shape {
      float: left;
      width: 43%;
      height: 240px;
      margin: 0 34px 18px 0;
      shape-outside: ellipse(48% 43% at 50% 50%);
      clip-path: ellipse(48% 43% at 50% 50%);
      background: #b75c43;
    }

    h1 {
      margin: 0;
      color: #5b2632;
      font-size: clamp(74px, 12vw, 142px);
      line-height: 0.82;
      letter-spacing: -0.09em;
    }

    .note {
      clear: both;
      margin: 34px 0 0;
      color: #b75c43;
      font: 13px/1.5 monospace;
      text-align: right;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="label">015 / negative space / shape exclusion</p>
    <div class="shape" aria-hidden="true"></div>
    <h1>Hello World</h1>
    <p class="note">an ellipse reserves the silence around the greeting</p>
  </main>
</body>
</html>
