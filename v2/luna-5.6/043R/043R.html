<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Radio Relay</title>
<style>
:root{color:#f4f0e1;background:#171b24;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 25% 50%,#3f6b65,#171b24 65%)}.relay{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f3bf63;overflow:hidden}.relay:before{position:absolute;left:22%;right:22%;top:50%;height:1px;background:#f3bf63;box-shadow:0 0 0 1px rgba(243,191,99,.12);content:""}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#f3bf63;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#a7dfcd;font:12px monospace}.antenna{position:relative;z-index:1;margin:12vh auto 0;width:280px;height:280px;border:1px solid #a7dfcd;border-radius:50%;display:grid;place-items:center}.antenna:before,.antenna:after{position:absolute;border:1px solid #f3bf63;border-radius:50%;content:""}.antenna:before{inset:35px}.antenna:after{inset:-35px}.antenna h1{margin:0;color:#f4f0e1;font-size:clamp(54px,10vw,118px);line-height:.8;letter-spacing:-.1em;text-align:center}.source{position:relative;z-index:1;margin:28px 0 0;color:#a7dfcd;font:12px monospace}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:12px}button{border:1px solid #f3bf63;padding:9px 14px;color:#f3bf63;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="relay"><p class="label">043R / radio relay / custom event</p><p class="state" id="state">relay / silent</p><section class="antenna"><h1>Hello<br>World</h1></section><p class="source">payload / Hello World</p><div class="controls"><button id="transmit" type="button">transmit pulse</button></div></main><script>
const relay=new EventTarget(),state=document.querySelector('#state'),antenna=document.querySelector('.antenna');relay.addEventListener('greeting',event=>{state.textContent=`relay / ${event.detail.message} / ${event.detail.strength}%`;antenna.animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:650})});document.querySelector('#transmit').addEventListener('click',()=>relay.dispatchEvent(new CustomEvent('greeting',{detail:{message:'Hello World',strength:Math.round(60+Math.random()*40)}})));
</script></body></html>
