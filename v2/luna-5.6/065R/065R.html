<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Entropy Garden</title>
<style>
:root{color:#edf5d6;background:#102315;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 60% 30%,#477447,#102315 70%)}.garden{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #d7e66d;overflow:hidden}.label,.state,.controls{position:relative;z-index:2}.label{margin:0;color:#d7e66d;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#bdd3ac;font:12px monospace}.plot{position:relative;z-index:1;margin:8vh auto 0;width:min(82vw,940px);height:420px;border-bottom:3px solid #d7e66d}.plot h1{position:absolute;left:50%;top:40%;z-index:2;margin:0;transform:translate(-50%,-50%);white-space:nowrap;color:#f5f0d9;font-size:clamp(54px,11vw,136px);line-height:.8;letter-spacing:-.1em}.seed{position:absolute;width:8px;height:8px;border-radius:50%;background:#f1ae62;box-shadow:0 0 14px #f1ae62;transform:translate(-50%,-50%);animation:grow .8s ease-out}@keyframes grow{from{scale:0}to{scale:1}}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #d7e66d;padding:9px 14px;color:#d7e66d;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="garden"><p class="label">065R / entropy garden / random bytes</p><p class="state" id="state">garden / soil is quiet</p><section class="plot" id="plot"><h1>Hello World</h1></section><div class="controls"><button id="grow" type="button">scatter entropy</button></div></main><script>
const plot=document.querySelector('#plot'),state=document.querySelector('#state');document.querySelector('#grow').addEventListener('click',()=>{const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);bytes.forEach((byte,index)=>{const seed=document.createElement('i');seed.className='seed';seed.style.left=`${5+(byte/255)*90}%`;seed.style.top=`${18+(index/23)*75}%`;plot.append(seed)});state.textContent='garden / 24 cryptographic seeds scattered'});
</script></body></html>
