<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Template</title><style>
:root{font-family:system-ui;background:#20141c;color:#fff0f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#20141c,#843c54)}main{width:min(90vw,1080px);padding:46px;border:1px solid #ffb0c8;background:#351d2b}p{color:#ffb0c8;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#b9f2d2;font:14px monospace}</style><main id="mount"><p>048 / template / inert blueprint</p><div class="state">template / cloning</div></main><template id="greeting"><h1>Hello World</h1></template><script>
const mount=document.querySelector('#mount'),template=document.querySelector('#greeting');mount.insertBefore(template.content.cloneNode(true),mount.querySelector('.state'));mount.querySelector('.state').textContent='template / cloned fragment';
