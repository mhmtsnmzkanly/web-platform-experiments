<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Channel</title><style>
:root{font-family:Arial,sans-serif;background:#0f2430;color:#e8f6f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f2430,#125c68)}.card{width:min(88vw,1080px);padding:44px;border:1px solid #80e6d0;background:#123944}p{margin:0 0 48px;color:#80e6d0;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{margin-top:46px;color:#f8c66d;font:14px monospace}</style></head><body><main class="card"><p>026 / channel / same-origin signal</p><h1>Hello World</h1><div class="state">channel / opening</div></main><script>
const state=document.querySelector('.state'),sender=new BroadcastChannel('hello-world-026'),receiver=new BroadcastChannel('hello-world-026');receiver.onmessage=({data})=>{state.textContent=`channel / received: ${data}`;sender.close();receiver.close()};sender.postMessage('Hello World');
</script></body></html>
