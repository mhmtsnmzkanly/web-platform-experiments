<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Supports</title><style>
:root{font-family:Arial;background:#121a20;color:#edfbff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#121a20,#286579)}main{width:min(90vw,1080px);padding:46px;border:1px solid #8ce8ff;background:#172d38}p{color:#8ce8ff;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#ffd374;font:14px monospace}</style><main><p>051 / css supports / capability gate</p><h1>Hello World</h1><div class="state">supports / testing</div></main><script>
