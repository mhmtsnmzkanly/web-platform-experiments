<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World — Orbit Plotter</title>
  <style>
    :root { color: #f5edd8; background: #11100d; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 45%, #30251b, #11100d 65%); }
    .plotter { position: relative; width: min(94vw, 1180px); height: min(88vh, 720px); border: 1px solid #d8a85e; background: #171510; }
    .plotter::before { position: absolute; inset: 0; background: linear-gradient(90deg, transparent 49.9%, rgba(216,168,94,.2) 50%, transparent 50.1%), linear-gradient(0deg, transparent 49.9%, rgba(216,168,94,.2) 50%, transparent 50.1%); background-size: 96px 96px; content: ""; pointer-events: none; }
    .label, .readout { position: absolute; z-index: 2; margin: 0; color: #d8a85e; font: 11px/1.4 monospace; letter-spacing: .18em; text-transform: uppercase; }
    .label { top: 24px; left: 28px; }
    .readout { right: 28px; bottom: 24px; color: #b4aa96; letter-spacing: .08em; text-transform: none; }
    svg { width: 100%; height: 100%; display: block; }
    .orbit { fill: none; stroke: #d8a85e; stroke-width: 1.5; stroke-dasharray: 5 10; opacity: .8; }
    .crosshair { fill: none; stroke: #6a604e; stroke-width: 1; }
    .hello { fill: #f5edd8; font: 700 92px/1 Arial, sans-serif; letter-spacing: -.08em; }
    .hello-shadow { fill: none; stroke: #d86642; stroke-width: 1; opacity: .85; font: 700 92px/1 Arial, sans-serif; letter-spacing: -.08em; }
    .node { fill: #d86642; stroke: #f5edd8; stroke-width: 2; }
    .trail { fill: none; stroke: #d86642; stroke-width: 2; opacity: .5; }
    .controls { position: absolute; left: 28px; right: 28px; bottom: 22px; display: flex; align-items: center; gap: 16px; color: #b4aa96; font: 12px monospace; }
    input { width: min(280px, 40vw); accent-color: #d86642; }
  </style>
</head>
<body>
  <main class="plotter">
    <p class="label">006R / orbit plotter / svg textPath</p>
    <p class="readout">curve <output id="curveValue">50</output></p>
    <svg viewBox="0 0 1180 720" role="img" aria-label="Hello World travelling around a cubic SVG path">
      <path id="orbitPath" class="orbit" d="M 120 430 C 300 80 870 80 1060 430"></path>
      <path id="shadowPath" class="hello-shadow" d="M 120 438 C 300 88 870 88 1060 438"></path>
      <path class="crosshair" d="M 590 170v380M 400 360h380"></path>
      <circle id="node" class="node" cx="590" cy="170" r="7"></circle>
      <text class="hello-shadow"><textPath id="shadowText" href="#shadowPath" startOffset="50%" text-anchor="middle">Hello World</textPath></text>
      <text class="hello"><textPath id="helloText" href="#orbitPath" startOffset="50%" text-anchor="middle">Hello World</textPath></text>
    </svg>
    <label class="controls" for="curve">reshape the trajectory <input id="curve" type="range" min="0" max="100" value="50"></label>
  </main>
  <script>
    const curve = document.querySelector('#curve');
    const curveValue = document.querySelector('#curveValue');
    const orbitPath = document.querySelector('#orbitPath');
    const shadowPath = document.querySelector('#shadowPath');
    const node = document.querySelector('#node');
    function updateOrbit() {
      const amount = Number(curve.value);
      const lift = 90 + amount * 2.8;
      const d = `M 120 430 C 300 ${lift} 880 ${lift} 1060 430`;
      orbitPath.setAttribute('d', d);
      shadowPath.setAttribute('d', `M 120 438 C 300 ${lift + 8} 880 ${lift + 8} 1060 438`);
      node.setAttribute('cy', lift);
      curveValue.value = amount;
    }
    curve.addEventListener('input', updateOrbit);
    updateOrbit();
  </script>
</body>
</html>
