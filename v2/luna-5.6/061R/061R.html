<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Time Oracle</title>
<style>
:root{color:#f7edcf;background:#161326;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,#59427b,#161326 68%)}.oracle{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f2c367}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#f2c367;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#cdbce3;font:12px monospace}.dial{position:relative;z-index:1;margin:9vh auto 0;width:min(64vw,700px);aspect-ratio:1;border:1px solid #f2c367;border-radius:50%;display:grid;place-items:center;background:repeating-conic-gradient(from 0deg,transparent 0 14deg,rgba(242,195,103,.2) 15deg 16deg)}.dial h1{margin:0;text-align:center;font-size:clamp(50px,9vw,110px);line-height:.82;letter-spacing:-.1em}.dial:before{position:absolute;inset:12%;border:1px dashed #bc75b1;border-radius:50%;content:""}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #f2c367;padding:9px 14px;color:#f2c367;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="oracle"><p class="label">061R / time oracle / relative format</p><p class="state" id="state">oracle / choose a moment</p><section class="dial"><h1>Hello World</h1></section><div class="controls"><button id="next" type="button">consult future</button></div></main><script>
const state=document.querySelector('#state'),format=new Intl.RelativeTimeFormat(undefined,{numeric:'auto'});let index=0;const moments=[-1,0,1,3];function consult(){const value=moments[index++%moments.length];const unit=Math.abs(value)>1?'days':'day';state.textContent=`oracle / ${format.format(value,unit)} / Hello World is ${value<0?'archived':value>0?'approaching':'present'}`}document.querySelector('#next').addEventListener('click',consult);consult();
</script></body></html>
