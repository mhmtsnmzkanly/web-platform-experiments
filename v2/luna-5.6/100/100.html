<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Binary Forge</title>
<style>
:root{color:#f5f1df;background:#171113;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#82422d,#171113 68%)}.forge{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f0bd61}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#f0bd61;font-size:11px;letter-spacing:.18em}.state{margin-top:10px;color:#e0b39c;font-size:12px}.anvil{position:relative;z-index:1;margin:13vh auto 0;width:min(82vw,940px);padding:35px 25px;border-bottom:24px solid #d86b65;border-top:1px solid #f0bd61;background:#2a1c1c;text-align:center}.anvil h1{margin:0;color:#f5f1df;font:700 clamp(58px,13vw,156px)/.8 Arial,sans-serif;letter-spacing:-.1em}.anvil code{display:block;margin-top:30px;color:#f0bd61;font-size:12px}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #f0bd61;padding:9px 14px;color:#f0bd61;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="forge"><p class="label">100 / binary forge / WebAssembly</p><p class="state" id="state">forge / module dormant</p><section class="anvil"><h1>Hello World</h1><code id="result">wasm result waiting</code></section><div class="controls"><button id="forge" type="button">forge bytes</button></div></main><script>
const result=document.querySelector('#result'),state=document.querySelector('#state');const bytes=Uint8Array.from(atob('AGFzbQEAAAABBQFgAAF/AwIBAAcIAQRtYWluAAAKBgEEAEEqCw=='),char=>char.charCodeAt(0));document.querySelector('#forge').addEventListener('click',async()=>{try{const module=await WebAssembly.instantiate(bytes);const value=module.instance.exports?.main?.()??0;result.textContent=`wasm result / ${value} / binary module executed`;state.textContent='forge / WebAssembly module fired'}catch(error){result.textContent=`wasm result / ${error.name}`;state.textContent='forge / module rejected'}});
</script></body></html>
