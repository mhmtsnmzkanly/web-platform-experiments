<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Gatekeeper Form</title>
<style>
:root{color:#edf4e8;background:#101d17;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#101d17,#3a684b)}.gate{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #bde06f}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#bde06f;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#d5dcae;font:12px monospace}.door{position:relative;z-index:1;margin:8vh auto 0;width:min(68vw,760px);height:390px;border:8px solid #bde06f;background:#1c3526;display:grid;place-items:center;transition:transform .4s,background .4s}.door.open{transform:perspective(700px) rotateY(-18deg);background:#74934a}.door h1{margin:0;color:#f2f0d9;text-align:center;font-size:clamp(58px,12vw,145px);line-height:.8;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px;display:flex;align-items:center;gap:10px}input{width:230px;padding:9px;border:1px solid #bde06f;color:#edf4e8;background:#172b1e;font:12px monospace}button{border:1px solid #bde06f;padding:9px 14px;color:#bde06f;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="gate"><p class="label">075R / gatekeeper / constraint validation</p><p class="state" id="state">gate / passphrase required</p><section class="door" id="door"><h1>Hello World</h1></section><div class="controls"><input id="pass" required minlength="4" placeholder="enter 4+ characters"><button id="enter" type="button">request entry</button></div></main><script>
const pass=document.querySelector('#pass'),door=document.querySelector('#door'),state=document.querySelector('#state');document.querySelector('#enter').addEventListener('click',()=>{if(pass.checkValidity()){door.classList.add('open');state.textContent='gate / validation passed / welcome inside'}else{door.classList.remove('open');pass.reportValidity();state.textContent=`gate / ${pass.validationMessage}`}});
</script></body></html>
