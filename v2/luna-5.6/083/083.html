<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Sorting Gallery</title>
<style>
:root{color:#f1efe6;background:#1a202a;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1a202a}.gallery{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #a2d8cf}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#a2d8cf;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#eec16a;font:12px monospace}.shelves{position:relative;z-index:1;display:flex;align-items:end;justify-content:center;gap:12px;margin:12vh auto 0;width:min(84vw,960px);height:350px;border-bottom:6px solid #eec16a}.source{position:absolute;left:28px;bottom:28px;color:#f1efe6;font:14px monospace}.tile{width:clamp(82px,13vw,145px);padding:18px 10px;background:#397e88;border:1px solid #a2d8cf;color:#f1efe6;writing-mode:vertical-rl;text-orientation:mixed;font-size:clamp(28px,4vw,48px);transition:transform .4s,background .4s}.tile:nth-child(2n){height:270px;background:#76518d}.tile:nth-child(3n){height:210px;background:#b15e58}.tile:nth-child(2n+1){height:320px}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #eec16a;padding:9px 14px;color:#eec16a;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="gallery"><p class="label">083 / sorting gallery / collator</p><p class="state" id="state">gallery / labels awaiting a curator</p><p class="source">Hello World</p><section class="shelves" id="shelves"><div class="tile">World</div><div class="tile">Hello</div><div class="tile">World</div><div class="tile">Hello</div></section><div class="controls"><button id="sort" type="button">curate labels</button></div></main><script>
const shelves=document.querySelector('#shelves'),state=document.querySelector('#state');document.querySelector('#sort').addEventListener('click',()=>{const collator=new Intl.Collator(undefined,{sensitivity:'base'}),tiles=[...shelves.children].sort((a,b)=>collator.compare(a.textContent,b.textContent));tiles.forEach(tile=>shelves.append(tile));state.textContent=`gallery / ${collator.resolvedOptions().locale} / labels curated with Collator`});
</script></body></html>
