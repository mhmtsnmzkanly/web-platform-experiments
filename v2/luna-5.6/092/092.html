<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Tone Dial</title>
<style>
:root{color:#f3f0dc;background:#211b2d;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,#76518d,#211b2d 70%)}.dial-room{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #efc46b}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#efc46b;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#d4c5e2;font:12px monospace}.dial{position:relative;z-index:1;margin:8vh auto 0;width:min(62vw,700px);aspect-ratio:1;border:1px solid #efc46b;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 180deg,#5e9ee0,#a965c8,#ef7775,#efc46b,#5e9ee0)}.dial h1{position:relative;margin:0;padding:20px;background:#211b2d;border-radius:50%;color:#f3f0dc;font-size:clamp(52px,9vw,110px);line-height:.8;letter-spacing:-.1em;text-align:center}.controls{position:absolute;right:28px;bottom:28px;display:flex;align-items:center;gap:10px}input{width:210px;accent-color:#efc46b}</style>
</head><body><main class="dial-room"><p class="label">092 / tone dial / datalist</p><p class="state" id="state">dial / select a tone</p><section class="dial"><h1>Hello World</h1></section><div class="controls"><label for="tone">tone <input id="tone" list="tones" value="indigo"></label><datalist id="tones"><option value="indigo"><option value="coral"><option value="gold"><option value="mint"></datalist></div></main><script>
const tone=document.querySelector('#tone'),state=document.querySelector('#state'),dial=document.querySelector('.dial');const colors={indigo:['#5e9ee0','#a965c8'],coral:['#ef7775','#efc46b'],gold:['#efc46b','#f6f0dc'],mint:['#65c6b0','#5e9ee0']};tone.addEventListener('input',()=>{const pair=colors[tone.value]||colors.indigo;dial.style.background=`conic-gradient(from 180deg,${pair[0]},${pair[1]},${pair[0]})`;state.textContent=`dial / datalist suggestion ${tone.value} / tone tuned`});
</script></body></html>
