<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Diplomatic Cable</title>
<style>
:root{color:#2c241c;background:#d8c4a5;font-family:Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#d8c4a5,#9c6e53)}.cable{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #2c241c;background:#e9d9ba;transform:rotate(-1deg);box-shadow:18px 18px 0 rgba(44,36,28,.35)}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#a94536;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#6e5742;font:12px monospace}.telegram{position:relative;z-index:1;margin:12vh 7% 0;padding:32px;border-top:3px double #a94536;border-bottom:3px double #a94536}.telegram h1{margin:0;font-size:clamp(64px,13vw,158px);line-height:.8;letter-spacing:-.1em}.telegram:after{position:absolute;right:0;top:50%;width:70px;height:70px;border:1px solid #a94536;border-radius:50%;transform:translateY(-50%) rotate(12deg);content:"OK"}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:12px}select{border:1px solid #a94536;padding:9px;color:#2c241c;background:#e9d9ba;font:12px monospace}</style>
</head><body><main class="cable"><p class="label">045R / diplomatic cable / list format</p><p class="state" id="state">format / en / ready</p><section class="telegram"><h1>Hello World</h1></section><div class="controls"><label for="locale">format <select id="locale"><option value="en">English</option><option value="tr">Turkish</option><option value="fr">French</option><option value="ja">Japanese</option></select></label></div></main><script>
const state=document.querySelector('#state'),locale=document.querySelector('#locale');function format(){const language=locale.value,stateValue=new Intl.ListFormat(language,{style:'long',type:'conjunction'}).format(['Hello','World','again']);state.textContent=`format / ${language} / ${stateValue}`}locale.addEventListener('change',format);format();
</script></body></html>
