<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Audio</title><style>
:root{font:16px system-ui;background:#130f24;color:#f5eaff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#5a348c,#130f24 68%)}main{width:min(90vw,1080px);padding:48px;border:1px solid #f19ad6;background:#24173e}p{color:#f19ad6;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0 0;font-size:clamp(72px,15vw,180px);line-height:.8;letter-spacing:-.1em}.state{margin-top:45px;color:#b9f5db;font:14px monospace}</style><main><p>031 / offline audio / waveform</p><h1>Hello World</h1><div class="state">audio / rendering</div></main><script>
const state=document.querySelector('.state'),ctx=new OfflineAudioContext(1,4410,44100),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=440;gain.gain.value=.2;osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(.1);ctx.startRendering().then(b=>{const d=b.getChannelData(0);let peak=0;for(const x of d)peak=Math.max(peak,Math.abs(x));state.textContent=`audio / offline render / peak ${peak.toFixed(2)}`}).catch(()=>state.textContent='audio / unavailable');
</script>
