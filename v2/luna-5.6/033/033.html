<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Parser</title><style>
:root{font-family:Georgia,serif;background:#efe7d3;color:#2b241c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#c9a66b}main{width:min(90vw,1080px);padding:45px;background:#f7f0df;border:1px solid #2b241c}p{color:#9c4b3d;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:48px 0 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{margin-top:45px;font:14px monospace;color:#9c4b3d}</style><main id="mount"><p>033 / domparser / fragment grammar</p><div class="state">parser / waiting</div></main><script>
const source='<h1>Hello World</h1>',doc=new DOMParser().parseFromString(source,'text/html'),mount=document.querySelector('#mount');mount.insertBefore(doc.body.firstElementChild,mount.querySelector('.state'));mount.querySelector('.state').textContent=`parser / ${doc.body.textContent.trim()}`;
</script>
