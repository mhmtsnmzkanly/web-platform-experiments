<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Route Atlas</title>
<style>
:root{color:#edf2ff;background:#101826;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#101826,#344b7a)}.atlas{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #a9c4ff;overflow:hidden}.atlas:before{position:absolute;inset:12% 8%;border:1px solid rgba(169,196,255,.4);border-radius:50%;transform:rotate(-18deg) scaleY(.55);content:""}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#a9c4ff;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:12px;color:#f2b77b;font:13px monospace}.route{position:relative;z-index:1;margin:15vh 8% 0;padding:24px;border-bottom:2px solid #f2b77b}.route:after{position:absolute;right:0;bottom:-7px;width:12px;height:12px;border-radius:50%;background:#f2b77b;content:""}.route h1{margin:0;font-size:clamp(68px,14vw,168px);line-height:.8;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:10px}input{width:min(260px,32vw);border:1px solid #a9c4ff;padding:9px;color:#edf2ff;background:#101826;font:12px monospace}button{border:1px solid #f2b77b;padding:9px 14px;color:#f2b77b;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="atlas"><p class="label">028R / route atlas / urlpattern</p><p class="state" id="state">pattern / waiting for route</p><section class="route"><h1>Hello World</h1></section><div class="controls"><input id="path" value="/hello-world" aria-label="Path"><button id="match" type="button">plot route</button></div></main><script>
const state=document.querySelector('#state'),path=document.querySelector('#path');function plot(){if(!globalThis.URLPattern){state.textContent='pattern / URLPattern unavailable';return}const pattern=new URLPattern({pathname:'/:greeting'}),match=pattern.exec({pathname:path.value});state.textContent=match?`pattern / ${match.pathname.groups.greeting} matched`:'pattern / no route match'}document.querySelector('#match').addEventListener('click',plot);plot();
</script></body></html>
