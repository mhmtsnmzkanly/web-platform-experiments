<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Navigation Odometer</title>
<style>
:root{color:#f5f0dc;background:#211a12;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#211a12,#70512c)}.odometer{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #e5b960}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#e5b960;font-size:11px;letter-spacing:.18em}.state{margin-top:10px;color:#dac09d;font-size:12px}.face{position:relative;z-index:1;margin:10vh auto 0;width:min(78vw,900px);padding:32px;background:#161613;border:8px double #e5b960;box-shadow:inset 0 0 0 12px #2c281d}.face h1{margin:0;color:#f5f0dc;font:700 clamp(58px,12vw,145px)/.8 Arial,sans-serif;letter-spacing:-.1em}.readout{display:block;margin-top:30px;color:#e5b960;font-size:12px}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #e5b960;padding:9px 14px;color:#e5b960;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="odometer"><p class="label">099 / navigation odometer / timing entry</p><p class="state" id="state">odometer / route timing waiting</p><section class="face"><h1>Hello World</h1><code class="readout" id="readout">navigation entry not inspected</code></section><div class="controls"><button id="read" type="button">inspect journey</button></div></main><script>
const state=document.querySelector('#state'),readout=document.querySelector('#readout');document.querySelector('#read').addEventListener('click',()=>{const entry=performance.getEntriesByType('navigation')[0];if(!entry){state.textContent='odometer / navigation entry unavailable';return}readout.textContent=`type ${entry.type} / transfer ${Math.round(entry.transferSize)} B / dom ${Math.round(entry.domContentLoadedEventEnd)} ms`;state.textContent='odometer / Navigation Timing entry inspected'});
</script></body></html>
