<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Coordinate Constellation</title>
<style>
:root{color:#edf2ff;background:#0a1120;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a1120}.starfield{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #88b7ed;overflow:hidden}.label,.state,.controls{position:relative;z-index:2}.label{margin:0;color:#88b7ed;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#eec46d;font:12px monospace}.field{position:relative;z-index:1;margin:7vh auto 0;width:min(82vw,950px);height:430px;border:1px solid #88b7ed;background-image:radial-gradient(#88b7ed 1px,transparent 1px);background-size:32px 32px}.field h1{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;white-space:nowrap;color:#f2f0df;font-size:clamp(52px,11vw,136px);line-height:.8;letter-spacing:-.1em}.point{position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:50%;background:#ec6878;box-shadow:0 0 22px #ec6878;transform:translate(-50%,-50%);transition:left .3s,top .3s}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:10px}input{width:150px;accent-color:#eec46d}</style>
</head><body><main class="starfield"><p class="label">085 / coordinate constellation / DOMPoint</p><p class="state" id="state">field / transform a point through Hello World</p><section class="field" id="field"><span class="point" id="point"></span><h1>Hello World</h1></section><div class="controls"><label for="x">x <input id="x" type="range" min="-150" max="150" value="0"></label><label for="y">y <input id="y" type="range" min="-120" max="120" value="0"></label></div></main><script>
const field=document.querySelector('#field'),point=document.querySelector('#point'),state=document.querySelector('#state'),x=document.querySelector('#x'),y=document.querySelector('#y');function move(){const origin=new DOMPoint(field.clientWidth/2,field.clientHeight/2),next=new DOMPoint(origin.x+Number(x.value),origin.y+Number(y.value));point.style.left=`${next.x}px`;point.style.top=`${next.y}px`;state.textContent=`field / DOMPoint ${Math.round(next.x)}, ${Math.round(next.y)} / constellation moved`}x.addEventListener('input',move);y.addEventListener('input',move);move();
</script></body></html>
