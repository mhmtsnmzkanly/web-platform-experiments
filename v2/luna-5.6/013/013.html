<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Shared Plate</title>
  <style>
    :root {
      background: #d8dde2;
      color: #27333d;
      font-family: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(90deg, transparent 0 49.8%, #b26c43 50% 50.2%, transparent 50.4%),
        #d8dde2;
    }

    .gallery {
      width: min(90vw, 1040px);
      padding: 42px 50px 50px;
      border: 1px solid #27333d;
      background: #eef1f3;
    }

    .label {
      margin: 0 0 52px;
      color: #b26c43;
      font: 12px/1.2 monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    greeting-plate {
      display: block;
    }

    greeting-plate + greeting-note {
      display: block;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main class="gallery">
    <p class="label">013 / shared plate / scoped type</p>
    <greeting-plate>Hello World</greeting-plate>
    <greeting-note>one constructable sheet / two shadow scopes</greeting-note>
  </main>
  <script>
    const shared = new CSSStyleSheet();
    shared.replaceSync(`
      :host {
        display: block;
      }
      .plate {
        padding: 36px 38px 42px;
        border: 1px solid #b26c43;
        background: #27333d;
        color: #eef1f3;
      }
      ::slotted(*) {
        color: #eef1f3;
      }
      .plate > slot {
        font: 700 clamp(72px, 15vw, 176px)/.82 Georgia, "Times New Roman", serif;
        letter-spacing: -.09em;
      }
      .note {
        color: #b26c43;
        font: 12px/1.4 monospace;
        letter-spacing: .15em;
        text-transform: uppercase;
      }
      .note > slot {
        font: inherit;
      }
    `);

    class GreetingPlate extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.adoptedStyleSheets = [shared];
        root.innerHTML = '<div class="plate"><slot></slot></div>';
      }
    }

    class GreetingNote extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: 'open' });
        root.adoptedStyleSheets = [shared];
        root.innerHTML = '<p class="note"><slot></slot></p>';
      }
    }

    customElements.define('greeting-plate', GreetingPlate);
    customElements.define('greeting-note', GreetingNote);
  </script>
</body>
</html>
