<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Orientation Compass</title>
<style>
:root{color:#edf1d3;background:#182119;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#182119,#5d7042)}.compass-room{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #e7c46c}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#e7c46c;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#c4d8b1;font:12px monospace}.compass{position:relative;z-index:1;margin:8vh auto 0;width:min(62vw,650px);aspect-ratio:1;border:2px solid #e7c46c;border-radius:50%;display:grid;place-items:center;background:repeating-conic-gradient(#314a30 0 10deg,#243822 10deg 20deg)}.compass:before{content:"N   E   S   W";position:absolute;inset:12%;display:grid;place-items:center;color:#e7c46c;font:12px monospace;word-spacing:clamp(40px,9vw,130px)}.compass h1{position:relative;margin:0;color:#f5eed9;font-size:clamp(50px,9vw,110px);line-height:.8;letter-spacing:-.1em;text-align:center}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #e7c46c;padding:9px 14px;color:#e7c46c;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="compass-room"><p class="label">067R / orientation compass / screen orientation</p><p class="state" id="state">compass / checking device heading</p><section class="compass"><h1>Hello World</h1></section><div class="controls"><button id="lock" type="button">request portrait</button></div></main><script>
const state=document.querySelector('#state'),orientation=screen.orientation;function read(){state.textContent=`compass / ${orientation?.type||'unknown'} / ${orientation?.angle||0}°`}orientation?.addEventListener('change',read);document.querySelector('#lock').addEventListener('click',async()=>{try{await orientation?.lock('portrait');state.textContent='compass / portrait lock requested'}catch(error){state.textContent=`compass / lock unavailable / ${error.name}`}});read();
</script></body></html>
