<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — FormData</title><style>
:root{font-family:Arial;background:#231a2e;color:#fff3fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(120deg,#231a2e,#743b61)}main{width:min(90vw,1080px);padding:46px;border:1px solid #ffadd8;background:#392241}p{color:#ffadd8;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#b9f5db;font:14px monospace}</style><main><p>035 / formdata / field transport</p><h1>Hello World</h1><div class="state">form / encoding</div></main><form hidden id="f"><input name="greeting" value="Hello World"></form><script>
