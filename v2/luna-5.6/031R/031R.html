<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Sound Chamber</title>
<style>
:root{color:#fff1df;background:#160f1b;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 48%,#693b5b,#160f1b 68%)}.chamber{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f3b36d;overflow:hidden}.label,.readout,.controls{position:relative;z-index:2}.label{margin:0;color:#f3b36d;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.readout{margin-top:10px;color:#dcb7d8;font:12px monospace}.rings{position:absolute;inset:18% 12%;display:grid;place-items:center}.ring{position:absolute;width:var(--size);height:var(--size);border:1px solid #f3b36d;border-radius:50%;animation:breathe 2.6s ease-in-out infinite alternate}.ring:nth-child(2){animation-delay:.3s;border-color:#8ee3c2}.ring:nth-child(3){animation-delay:.6s;border-color:#d98ac7}@keyframes breathe{to{transform:scale(1.1);opacity:.35}}h1{position:relative;z-index:2;margin:22vh 0 0;font-size:clamp(68px,14vw,170px);line-height:.8;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px;display:flex;align-items:center;gap:12px;color:#dcb7d8;font:12px monospace}input{width:min(240px,32vw);accent-color:#f3b36d}</style>
</head><body><main class="chamber"><p class="label">031R / sound chamber / offline audio</p><p class="readout" id="readout">render / standing by</p><div class="rings"><i class="ring" style="--size:220px"></i><i class="ring" style="--size:360px"></i><i class="ring" style="--size:500px"></i></div><h1>Hello World</h1><label class="controls" for="pitch">resonance <input id="pitch" type="range" min="120" max="880" value="440"></label></main><script>
const pitch=document.querySelector('#pitch'),readout=document.querySelector('#readout');async function render(){const frequency=Number(pitch.value),context=new OfflineAudioContext(1,44100,44100),oscillator=context.createOscillator(),gain=context.createGain();oscillator.frequency.value=frequency;gain.gain.value=.08;oscillator.connect(gain).connect(context.destination);oscillator.start();oscillator.stop(.35);const buffer=await context.startRendering();readout.textContent=`render / ${frequency} Hz / ${buffer.length} samples`;document.querySelectorAll('.ring').forEach((ring,i)=>ring.style.animationDuration=`${Math.max(.8,1.9-i*.18)}s`)}pitch.addEventListener('input',render);render();
</script></body></html>
