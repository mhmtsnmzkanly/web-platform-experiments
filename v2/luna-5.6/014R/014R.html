<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World — Weather Glyph</title>
  <style>
    :root { color: #e6f1df; background: #0c282d; font-family: Georgia, "Times New Roman", serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 70% 25%, #3a7772, transparent 35%), #0c282d; }
    .weather { position: relative; width: min(94vw, 1180px); min-height: min(84vh, 680px); padding: 28px; border: 1px solid #b8d7a7; }
    .label, .readout { position: relative; z-index: 2; margin: 0; color: #f0a16d; font: 11px/1.4 monospace; letter-spacing: .18em; text-transform: uppercase; }
    .readout { margin-top: 8px; color: #b8d7a7; letter-spacing: .08em; text-transform: none; }
    svg { width: 100%; height: 500px; display: block; margin-top: 4vh; }
    .horizon { fill: none; stroke: #f0a16d; stroke-width: 2; stroke-dasharray: 5 16; }
    .halo { fill: none; stroke: #b8d7a7; stroke-width: 1; opacity: .7; }
    text { fill: #e6f1df; font: 700 142px Georgia, "Times New Roman", serif; letter-spacing: -4px; }
    .controls { position: absolute; right: 28px; bottom: 28px; display: flex; align-items: center; gap: 14px; color: #b8d7a7; font: 12px monospace; }
    input { width: 220px; accent-color: #f0a16d; }
  </style>
</head>
<body>
  <main class="weather">
    <p class="label">014R / weather glyph / displacement field</p>
    <p class="readout">turbulence scale <output id="scaleValue">18</output></p>
    <svg viewBox="0 0 1100 500" role="img" aria-label="Hello World distorted by procedural weather">
      <defs>
        <filter id="weatherFilter" x="-10%" y="-30%" width="120%" height="160%">
          <feTurbulence id="turbulence" type="fractalNoise" baseFrequency=".018 .05" numOctaves="2" seed="14" result="noise"></feTurbulence>
          <feDisplacementMap id="displacement" in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="B"></feDisplacementMap>
        </filter>
      </defs>
      <ellipse class="halo" cx="550" cy="245" rx="380" ry="150"></ellipse>
      <path class="horizon" d="M 80 350 C 290 280, 460 410, 690 330 S 920 290, 1020 350"></path>
      <text x="550" y="285" text-anchor="middle" filter="url(#weatherFilter)">Hello World</text>
    </svg>
    <label class="controls" for="scale">change the pressure <input id="scale" type="range" min="0" max="42" value="18"></label>
  </main>
  <script>
    const scale = document.querySelector('#scale');
    const displacement = document.querySelector('#displacement');
    const scaleValue = document.querySelector('#scaleValue');
    scale.addEventListener('input', () => {
      displacement.setAttribute('scale', scale.value);
      scaleValue.value = scale.value;
    });
  </script>
</body>
</html>
