<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Signal Buoy</title>
<style>
:root{color:#eaf8ff;background:#081c29;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#081c29,#174c67)}.buoy-room{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #87dddc}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#87dddc;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#f2c067;font:12px monospace}.sea{position:relative;z-index:1;margin:8vh auto 0;width:min(80vw,930px);height:420px;border-bottom:4px solid #87dddc;background:repeating-linear-gradient(170deg,transparent 0 30px,rgba(135,221,220,.16) 31px 33px)}.phrase{position:absolute;left:7%;bottom:18px;color:#bcebe4;font:14px monospace}.buoy{position:absolute;left:50%;top:50%;width:125px;height:125px;border-radius:50%;transform:translate(-50%,-50%);background:#f26570;box-shadow:0 0 0 18px rgba(242,101,112,.12),0 0 0 42px rgba(242,101,112,.08);display:grid;place-items:center}.buoy h1{margin:0;color:#fff2da;font-size:34px;text-align:center;line-height:.8;letter-spacing:-.08em}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #f2c067;padding:9px 14px;color:#f2c067;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="buoy-room"><p class="label">071R / signal buoy / online state</p><p class="state" id="state">sea / checking the signal</p><section class="sea"><p class="phrase">Hello World</p><div class="buoy"><h1>Hello<br>World</h1></div></section><div class="controls"><button id="ping" type="button">ping signal</button></div></main><script>
const state=document.querySelector('#state');function read(){state.textContent=`sea / signal ${navigator.onLine?'afloat':'lost'} / ${navigator.onLine?'online':'offline'}`}addEventListener('online',read);addEventListener('offline',read);document.querySelector('#ping').addEventListener('click',read);read();
</script></body></html>
