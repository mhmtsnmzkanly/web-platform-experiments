<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Cache Vault</title>
<style>
:root{color:#ecf7ff;background:#101b2a;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101b2a,#315d77)}.vault{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #84ddd2}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#84ddd2;font-size:11px;letter-spacing:.18em}.state{margin-top:10px;color:#f0c36a;font-size:12px}.door{position:relative;z-index:1;margin:10vh auto 0;width:min(70vw,800px);height:380px;border:12px solid #84ddd2;background:#16384b;display:grid;place-items:center;transition:transform .4s,background .4s}.door:after{position:absolute;right:22px;top:50%;width:18px;height:18px;border-radius:50%;background:#f0c36a;box-shadow:0 0 14px #f0c36a;content:""}.door h1{margin:0;color:#edf4dc;font:700 clamp(58px,12vw,145px)/.8 Arial,sans-serif;letter-spacing:-.1em}.door.open{transform:perspective(700px) rotateY(-16deg);background:#287185}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:10px}button{border:1px solid #f0c36a;padding:9px 14px;color:#f0c36a;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="vault"><p class="label">097 / cache vault / cache storage</p><p class="state" id="state">vault / door locked</p><section class="door" id="door"><h1>Hello World</h1></section><div class="controls"><button id="store" type="button">store greeting</button><button id="open" type="button">open vault</button></div></main><script>
const door=document.querySelector('#door'),state=document.querySelector('#state');let cache;document.querySelector('#store').addEventListener('click',async()=>{cache=await caches.open('hello-vault-097');await cache.put('/hello-world',new Response('Hello World'));state.textContent='vault / greeting stored in Cache API'});document.querySelector('#open').addEventListener('click',async()=>{cache??=await caches.open('hello-vault-097');const response=await cache.match('/hello-world');door.classList.toggle('open',Boolean(response));state.textContent=response?'vault / cached greeting retrieved':'vault / nothing stored yet'});
</script></body></html>
