<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Spine</title>
  <style>
    :root {
      color: #f3efe1;
      background: #1d2430;
      font-family: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(90deg, transparent 0 49.8%, #e4a24c 50% 50.2%, transparent 50.4%),
        #1d2430;
    }

    .book {
      width: min(78vw, 700px);
      height: min(88vh, 700px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 42px;
      padding: 40px;
      border: 1px solid #e4a24c;
      background: #273244;
      box-shadow: 18px 18px 0 #121820;
    }

    .edge {
      height: 100%;
      border-inline-start: 1px solid #60728b;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      color: #9eb0c7;
      font: 12px/1 monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .edge:last-child {
      justify-self: end;
      transform: rotate(180deg);
    }

    h1 {
      margin: 0;
      color: #f3efe1;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: clamp(24px, 4vw, 40px);
      line-height: 0.75;
      letter-spacing: 0.02em;
      text-align: center;
      white-space: nowrap;
    }

    h1::first-letter {
      color: #e4a24c;
    }
  </style>
</head>
<body>
  <main class="book">
    <p class="edge">vertical inline axis</p>
    <h1>Hello World</h1>
    <p class="edge">upright glyphs</p>
  </main>
</body>
</html>
