<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Frame Recorder</title>
<style>
:root{color:#f6edda;background:#21151b;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#21151b,#713e4c)}.recorder{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f0bd6a}.label,.state,.controls{position:relative;z-index:2}.label{margin:0;color:#f0bd6a;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#dcbac3;font:12px monospace}.screen{position:relative;z-index:1;margin:10vh auto 0;width:min(78vw,900px);height:360px;border:1px solid #f0bd6a;background:#34202b;display:grid;place-items:center}.screen h1{margin:0;color:#f7f0da;font-size:clamp(60px,13vw,156px);line-height:.8;letter-spacing:-.1em}.red{position:absolute;right:20px;top:20px;width:12px;height:12px;border-radius:50%;background:#dc6576;box-shadow:0 0 15px #dc6576}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #f0bd6a;padding:9px 14px;color:#f0bd6a;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="recorder"><p class="label">087 / frame recorder / media recorder</p><p class="state" id="state">screen / camera armed, not recording</p><section class="screen" id="screen"><i class="red"></i><h1>Hello World</h1></section><div class="controls"><button id="record" type="button">record a second</button></div></main><script>
const screen=document.querySelector('#screen'),state=document.querySelector('#state');document.querySelector('#record').addEventListener('click',()=>{if(!window.MediaRecorder||!screen.captureStream){state.textContent='screen / MediaRecorder unavailable';return}const chunks=[],recorder=new MediaRecorder(screen.captureStream(12));recorder.ondataavailable=event=>chunks.push(event.data);recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType});state.textContent=`screen / ${recorder.mimeType} / ${Math.round(blob.size/1024)} KB captured`};recorder.start();state.textContent='screen / recording a one-second greeting';setTimeout(()=>recorder.stop(),1000)});
</script></body></html>
