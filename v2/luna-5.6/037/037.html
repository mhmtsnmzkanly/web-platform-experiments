<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Abort</title><style>
:root{font-family:Arial;background:#201414;color:#fff1e6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#201414,#8a493c)}main{width:min(90vw,1080px);padding:46px;border:1px solid #ffc16b;background:#38201e}p{color:#ffc16b;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#9ff0d0;font:14px monospace}</style><main><p>037 / abort / controlled cancellation</p><h1>Hello World</h1><div class="state">signal / pending</div></main><script>
const state=document.querySelector('.state'),controller=new AbortController();setTimeout(()=>controller.abort('finished'),25);new Promise((_,reject)=>setTimeout(()=>reject(new DOMException('Cancelled','AbortError')),80)).catch(e=>{if(controller.signal.aborted)state.textContent=`signal / aborted / ${e.name}`});
</script>
