<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Transition</title>
  <style>
    :root { background: #17131f; color: #f5e9d2; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17131f; }
    .stage { width: min(90vw, 1040px); padding: 46px 54px 52px; border: 1px solid #ff9b71; background: #281d35; }
    .label { margin: 0 0 58px; color: #ff9b71; font: 12px/1.2 monospace; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; color: #f5e9d2; font-size: clamp(72px, 15vw, 176px); line-height: .82; letter-spacing: -.1em; view-transition-name: greeting; }
    body.settled h1 { color: #8fe0c1; transform: translateX(16px); }
    ::view-transition-old(greeting), ::view-transition-new(greeting) { animation-duration: 520ms; }
    .note { margin: 52px 0 0; color: #c6b7d6; font: 13px/1.5 monospace; }
  </style>
</head>
<body>
  <main class="stage">
    <p class="label">019 / transition / native snapshot</p>
    <h1>Hello World</h1>
    <p class="note">the browser interpolates the named greeting surface</p>
  </main>
  <script>
    const settle = () => {
      if (document.startViewTransition) {
        document.startViewTransition(() => document.body.classList.add('settled'));
      } else {
        document.body.classList.add('settled');
      }
    };
    requestAnimationFrame(settle);
  </script>
</body>
</html>
