<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Pulse Observatory</title>
<style>
:root{color:#e8f5ff;background:#0d1a26;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1a26}.observatory{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #7fded1}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#7fded1;font-size:11px;letter-spacing:.18em}.state{margin-top:10px;color:#f1bd65;font-size:12px}.scope{position:relative;z-index:1;margin:9vh auto 0;width:min(74vw,860px);height:350px;border:1px solid #7fded1;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 29px,rgba(127,222,209,.15) 30px 31px)}.scope h1{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:#e8f5ff;font:700 clamp(60px,13vw,156px)/.8 Arial,sans-serif;letter-spacing:-.1em}.pulse{position:absolute;bottom:0;left:0;width:4px;height:0;background:#f1bd65;transition:height .25s;box-shadow:0 0 18px #f1bd65}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #f1bd65;padding:9px 14px;color:#f1bd65;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="observatory"><p class="label">080 / pulse observatory / performance observer</p><p class="state" id="state">scope / mark a pulse to begin</p><section class="scope"><h1>Hello World</h1><i class="pulse" id="pulse"></i></section><div class="controls"><button id="mark" type="button">mark pulse</button></div></main><script>
const state=document.querySelector('#state'),pulse=document.querySelector('#pulse'),observer=new PerformanceObserver(list=>{const entry=list.getEntries().at(-1);const height=Math.min(300,30+entry.duration*15);pulse.style.height=`${height}px`;state.textContent=`scope / ${entry.name} / ${entry.duration.toFixed(2)} ms`});observer.observe({entryTypes:['measure']});document.querySelector('#mark').addEventListener('click',()=>{performance.mark('hello-start');requestAnimationFrame(()=>{performance.mark('hello-end');performance.measure('hello-pulse','hello-start','hello-end')})});
</script></body></html>
