<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Data Conveyor</title>
<style>
:root{color:#edf5ff;background:#111b2b;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111b2b}.factory{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #74d9d2}.label,.state,.controls{position:relative;z-index:2}.label{margin:0;color:#74d9d2;font-size:11px;letter-spacing:.18em}.state{margin-top:10px;color:#efc36a;font-size:12px}.belt{position:relative;z-index:1;margin:13vh auto 0;width:min(82vw,940px);height:220px;border-bottom:14px solid #74d9d2;border-top:1px dashed #74d9d2;overflow:hidden}.box{position:absolute;left:0;top:65px;padding:22px;background:#b55c77;color:#fff0dc;font:700 clamp(36px,6vw,74px)/.8 Arial,sans-serif;letter-spacing:-.1em;white-space:nowrap}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #efc36a;padding:9px 14px;color:#efc36a;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="factory"><p class="label">088 / data conveyor / transform stream</p><p class="state" id="state">conveyor / package waiting for a transform</p><section class="belt"><div class="box" id="box">Hello World</div></section><div class="controls"><button id="run" type="button">run conveyor</button></div></main><script>
const box=document.querySelector('#box'),state=document.querySelector('#state');document.querySelector('#run').addEventListener('click',async()=>{const transformer=new TransformStream({transform(chunk,controller){controller.enqueue(chunk.toUpperCase())}}),writer=transformer.writable.getWriter(),reader=transformer.readable.getReader();writer.write('Hello World');writer.close();const result=await reader.read();box.textContent=result.value;box.animate([{left:'0%'},{left:'82%'}],{duration:900,fill:'forwards'});state.textContent='conveyor / TransformStream delivered uppercase package'});
</script></body></html>
