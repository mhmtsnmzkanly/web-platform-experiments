<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Capability Scanner</title>
<style>
:root{color:#e8f3ff;background:#101a2c;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101a2c,#274a75)}.scanner{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #74d7ec}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#74d7ec;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#f2c66a;font-size:12px}.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12vh 6% 0}.probe{min-height:120px;padding:18px;border:1px solid #74d7ec;background:#152740}.probe b{display:block;color:#f2c66a}.probe i{display:block;width:16px;height:16px;margin-top:22px;border-radius:50%;background:#d85e78}.probe.yes i{background:#8ee3c2}.source{position:relative;z-index:1;margin:18px 6% 0;color:#e8f3ff;font-size:14px}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #f2c66a;padding:9px 14px;color:#f2c66a;background:transparent;font:12px monospace;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
</head><body><main class="scanner"><p class="label">051R / capability scanner / css.supports</p><p class="state" id="state">scanner / awaiting probes</p><p class="source">Hello World</p><section class="grid" id="grid"></section><div class="controls"><button id="scan" type="button">scan browser</button></div></main><script>
const grid=document.querySelector('#grid'),state=document.querySelector('#state'),probes=[['container','container-type:inline-size'],['blur','backdrop-filter:blur(2px)'],['grid','display:grid']];function scan(){grid.replaceChildren(...probes.map(([name,rule])=>{const node=document.createElement('div');node.className=`probe ${CSS.supports(rule)?'yes':''}`;node.innerHTML=`<b>${name}</b><small>${rule}</small><i></i>`;return node}));state.textContent=`scanner / ${probes.filter(([,rule])=>CSS.supports(rule)).length}/${probes.length} capabilities online`}document.querySelector('#scan').addEventListener('click',scan);scan();
</script></body></html>
