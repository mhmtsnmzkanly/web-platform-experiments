<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Word Choir</title>
<style>
:root{color:#f4f0dc;background:#111d27;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#111d27,#30556a)}.choir{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f3bf68}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#f3bf68;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#a9d9d4;font:12px monospace}.voices{position:relative;z-index:1;display:flex;align-items:end;justify-content:center;gap:clamp(8px,2vw,28px);margin:15vh auto 0;height:330px}.voice{width:clamp(46px,8vw,90px);background:#75c7bd;border:1px solid #f3bf68;transition:height .25s}.voice:nth-child(2n){background:#638ae0}.voice:nth-child(3n){background:#d46883}.voice b{display:block;transform:translateY(-28px);font-size:12px;color:#f4f0dc}.controls{position:absolute;right:28px;bottom:28px;display:flex;align-items:center;gap:10px}input{width:180px;accent-color:#f3bf68}</style>
</head><body><main class="choir"><p class="label">062R / word choir / plural rules</p><p class="state" id="state">choir / one voice waiting</p><p style="position:absolute;left:6%;bottom:28px;color:#f4f0dc;font-size:14px">Hello World</p><section class="voices"><div class="voice"><b>Hello</b></div><div class="voice"><b>World</b></div><div class="voice"><b>voice</b></div><div class="voice"><b>voices</b></div></section><div class="controls"><label for="count">count <input id="count" type="range" min="0" max="12" value="1"></label></div></main><script>
const count=document.querySelector('#count'),state=document.querySelector('#state'),voices=[...document.querySelectorAll('.voice')],rules=new Intl.PluralRules();function sing(){const value=Number(count.value),form=rules.select(value),height=70+value*17;voices.forEach((voice,index)=>voice.style.height=`${height+(index%2)*28}px`);state.textContent=`choir / ${value} ${form==='one'?'voice':'voices'} / plural category: ${form}`}count.addEventListener('input',sing);sing();
</script></body></html>
