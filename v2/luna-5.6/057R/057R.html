<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Vector Racetrack</title>
<style>
:root{color:#e9f5ff;background:#08151e;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#08151e,#17435a)}.track{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #5fd7d4;overflow:hidden}.label,.state,.controls{position:relative;z-index:2}.label{margin:0;color:#5fd7d4;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#e6b866;font:12px monospace}svg{position:relative;z-index:1;display:block;width:min(88vw,1040px);height:440px;margin:7vh auto 0;overflow:visible}.rail{fill:none;stroke:#5fd7d4;stroke-width:4;stroke-dasharray:12 14}.inner{fill:none;stroke:#d65b91;stroke-width:2;stroke-dasharray:5 12}.car{fill:#e6b866;transition:transform .2s}.word{font:700 86px Arial;letter-spacing:-8px;fill:#e9f5ff}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #e6b866;padding:9px 14px;color:#e6b866;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="track"><p class="label">057R / vector racetrack / path geometry</p><p class="state" id="state">track / path loaded / racer parked</p><svg viewBox="0 0 1000 440" aria-label="Vector track"><defs><path id="route" d="M120 300 C120 80 420 50 500 220 S880 370 860 120"/></defs><path class="rail" d="M120 300 C120 80 420 50 500 220 S880 370 860 120"/><path class="inner" d="M170 300 C170 130 425 105 510 240 S820 330 810 145"/><text class="word" x="120" y="410">Hello World</text><circle class="car" id="car" r="13" cx="120" cy="300"/></svg><div class="controls"><button id="race" type="button">run the route</button></div></main><script>
const route=new Path2D('M120 300 C120 80 420 50 500 220 S880 370 860 120'),svg=document.querySelector('svg'),car=document.querySelector('#car'),state=document.querySelector('#state');document.querySelector('#race').addEventListener('click',()=>{let t=0;state.textContent='track / Path2D route in motion';function frame(){t+=.008;const x=120+740*t,y=300-180*Math.sin(t*Math.PI);car.setAttribute('cx',x);car.setAttribute('cy',y);if(t<1)requestAnimationFrame(frame);else state.textContent='track / racer reached the finish'}frame()});
</script></body></html>
