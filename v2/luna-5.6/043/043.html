<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Event</title><style>
:root{font-family:system-ui;background:#171717;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#171717,#6f4d2e)}main{width:min(90vw,1080px);padding:46px;border:1px solid #ffce78;background:#29251e}p{color:#ffce78;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#aaf0c9;font:14px monospace}</style><main><p>043 / eventtarget / custom signal</p><h1>Hello World</h1><div class="state">event / waiting</div></main><script>
const target=new EventTarget(),state=document.querySelector('.state');target.addEventListener('greeting',{once:true});target.addEventListener('greeting',e=>state.textContent=`event / ${e.detail} / received`);target.dispatchEvent(new CustomEvent('greeting',{detail:'Hello World'}));
</script>
