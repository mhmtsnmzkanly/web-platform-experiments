<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Signal Constellation</title>
<style>
:root{color:#e8f6f3;background:#081b26;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#125c68,#081b26 70%)}.constellation{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);overflow:hidden;border:1px solid #80e6d0}.constellation:before{position:absolute;inset:0;background-image:radial-gradient(#80e6d0 1px,transparent 1px);background-size:48px 48px;opacity:.25;content:""}.label,.state,.controls{position:relative;z-index:1}.label{margin:28px;color:#80e6d0;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin:0 28px;color:#f8c66d;font:13px monospace}.nodes{position:absolute;inset:18% 10% 18%;}.node{position:absolute;width:20px;height:20px;border:2px solid #80e6d0;border-radius:50%;box-shadow:0 0 0 8px rgba(128,230,208,.12)}.node:nth-child(1){left:12%;top:24%}.node:nth-child(2){left:48%;top:12%}.node:nth-child(3){right:14%;top:42%}.node:nth-child(4){left:31%;bottom:12%}.node:nth-child(5){right:34%;bottom:20%}.beam{position:absolute;left:15%;top:26%;width:66%;height:1px;background:#80e6d0;transform:rotate(13deg);transform-origin:left;opacity:.45}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:12px}button{border:1px solid #f8c66d;padding:9px 14px;color:#f8c66d;background:transparent;font:12px monospace;cursor:pointer}button:hover{background:#f8c66d;color:#081b26}.pulse{animation:pulse .8s ease}@keyframes pulse{50%{transform:scale(1.8);box-shadow:0 0 0 18px rgba(248,198,109,.2),0 0 30px #f8c66d;border-color:#f8c66d}}</style>
</head><body><main class="constellation"><p class="label">026R / signal constellation / broadcast channel</p><p class="state" id="state">channel / listening for a local star</p><div class="nodes"><i class="node"></i><i class="node"></i><i class="node"></i><i class="node"></i><i class="node"></i><i class="beam"></i></div><div class="controls"><button id="send" type="button">send Hello World</button></div></main><script>
const state=document.querySelector('#state'),nodes=[...document.querySelectorAll('.node')],sender=new BroadcastChannel('hello-world-026r'),receiver=new BroadcastChannel('hello-world-026r');receiver.onmessage=({data})=>{state.textContent=`channel / received: ${data}`;nodes.forEach((node,i)=>setTimeout(()=>{node.classList.add('pulse');setTimeout(()=>node.classList.remove('pulse'),800)},i*130))};document.querySelector('#send').addEventListener('click',()=>sender.postMessage('Hello World'));sender.postMessage('Hello World');
</script></body></html>
