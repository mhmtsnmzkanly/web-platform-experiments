<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Tilt</title>
  <style>
    :root {
      background: #101827;
      color: #f8f3e8;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(115deg, transparent 0 49.8%, #ef8b43 50% 50.2%, transparent 50.4%),
        #101827;
      perspective: 1100px;
    }

    .sign {
      width: min(88vw, 1050px);
      padding: 34px 44px 40px;
      border: 1px solid #ef8b43;
      background: #1b2a43;
      transform: rotateX(7deg) rotateY(-13deg) rotateZ(-2deg);
      box-shadow: 24px 30px 0 #080d16;
    }

    .label {
      margin: 0 0 24px;
      color: #ef8b43;
      font: 12px/1.2 monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #f8f3e8;
      font-size: clamp(64px, 12vw, 156px);
      line-height: 0.9;
      letter-spacing: -0.08em;
      white-space: nowrap;
      text-shadow: 8px 8px 0 #405879;
    }

    .baseline {
      height: 3px;
      margin-top: 30px;
      background: #ef8b43;
      transform: skewX(-18deg);
      transform-origin: left;
    }
  </style>
</head>
<body>
  <main class="sign">
    <p class="label">006 / tilt / perspective plane</p>
    <h1>Hello World</h1>
    <div class="baseline" aria-hidden="true"></div>
  </main>
</body>
</html>
