<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Intersection</title><style>
:root{font-family:Arial,sans-serif;background:#e8e0d0;color:#241d18}*{box-sizing:border-box}body{margin:0;min-height:160vh;background:linear-gradient(#e8e0d0 0 52%,#b85c45 100%)}.stage{position:fixed;inset:0;display:grid;place-items:center}.card{width:min(88vw,1060px);padding:44px;border:1px solid #241d18;background:#f4ebd8;transition:.6s ease;opacity:.35;transform:translateY(16px)}.card.seen{opacity:1;transform:none;box-shadow:16px 16px 0 #241d18}p{margin:0 0 44px;color:#b85c45;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(72px,15vw,176px);line-height:.8;letter-spacing:-.1em}.state{margin-top:45px;font:14px monospace}</style></head><body><section class="stage"><main class="card"><p>024 / intersection / viewport event</p><h1>Hello World</h1><div class="state">observer / waiting</div></main></section><script>
const card=document.querySelector('.card'),state=document.querySelector('.state');new IntersectionObserver(([entry])=>{if(entry.isIntersecting){card.classList.add('seen');state.textContent=`observer / ${Math.round(entry.intersectionRatio*100)}% visible`;}} ,{threshold:[.5]}).observe(card);
</script></body></html>
