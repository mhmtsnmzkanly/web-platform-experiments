<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Streaming Typewriter</title>
<style>
:root{color:#f3f0dc;background:#18140f;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:repeating-linear-gradient(0deg,#18140f 0 28px,#211b13 29px 30px)}.typewriter{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #dfac5d}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#dfac5d;font-size:11px;letter-spacing:.18em}.state{margin-top:10px;color:#c9d39e;font-size:12px}.paper{position:relative;z-index:1;margin:14vh auto 0;width:min(82vw,940px);min-height:260px;padding:34px;border:1px solid #dfac5d;background:#f3e8c5;color:#35271c;box-shadow:10px 12px 0 rgba(0,0,0,.22)}.paper h1{margin:0;font-size:clamp(56px,12vw,145px);line-height:.8;letter-spacing:-.1em;white-space:nowrap}.cursor{display:inline-block;width:12px;height:1em;background:#d85f71;vertical-align:-.12em;animation:blink .8s steps(2) infinite}@keyframes blink{50%{opacity:0}}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #dfac5d;padding:9px 14px;color:#dfac5d;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="typewriter"><p class="label">089 / streaming typewriter / decoder stream</p><p class="state" id="state">paper / stream is dry</p><section class="paper"><h1 id="text">Hello World</h1></section><div class="controls"><button id="type" type="button">type greeting</button></div></main><script>
const text=document.querySelector('#text'),state=document.querySelector('#state');document.querySelector('#type').addEventListener('click',async()=>{text.textContent='';const source=new ReadableStream({start(controller){controller.enqueue(new TextEncoder().encode('Hello World'));controller.close()}}),decoded=source.pipeThrough(new TextDecoderStream()),reader=decoded.getReader();let result='';for(;;){const part=await reader.read();if(part.done)break;for(const char of part.value){result+=char;text.textContent=result;await new Promise(resolve=>setTimeout(resolve,45))}}state.textContent='paper / TextDecoderStream finished the line'});
</script></body></html>
