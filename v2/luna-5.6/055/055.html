<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Selection</title><style>
:root{font-family:Arial;background:#18151f;color:#f7f1ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#18151f,#66416c)}main{width:min(90vw,1080px);padding:46px;border:1px solid #ffb0df;background:#2b1f36}p{color:#ffb0df;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#b9f5d6;font:14px monospace}</style><main><p>055 / selection / browser range</p><h1 id="greeting">Hello World</h1><div class="state">selection / creating</div></main><script>
const h=document.querySelector('#greeting'),r=document.createRange(),sel=getSelection();r.selectNodeContents(h);sel.removeAllRanges();sel.addRange(r);document.querySelector('.state').textContent=`selection / ${sel.toString()} / active`;
</script>
