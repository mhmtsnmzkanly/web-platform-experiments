<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Visibility</title><style>
:root{font-family:Arial;background:#161218;color:#fff2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#161218,#633c67)}main{width:min(90vw,1080px);padding:46px;border:1px solid #f5a8dc;background:#2c1c34}p{color:#f5a8dc;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#b7f4d1;font:14px monospace}</style><main><p>069 / document visibility / lifecycle state</p><h1>Hello World</h1><div class="state">visibility / reading</div></main><script>
const s=document.querySelector('.state'),render=()=>s.textContent=`visibility / ${document.visibilityState} / lifecycle`;document.addEventListener('visibilitychange',render);render();
</script>
