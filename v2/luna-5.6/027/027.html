<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — IndexedDB</title><style>
:root{font-family:Georgia,serif;background:#241c16;color:#f8ecd5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 15%,#97543d,#241c16 60%)}.card{width:min(88vw,1080px);padding:46px;border:1px solid #f1c56c;background:#32231b;box-shadow:0 0 0 12px #32231b,0 0 0 13px #f1c56c}p{margin:0 0 48px;color:#f1c56c;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{margin-top:48px;color:#d7bda1;font:14px monospace}</style></head><body><main class="card"><p>027 / indexeddb / persistent record</p><h1>Hello World</h1><div class="state">database / opening</div></main><script>
const state=document.querySelector('.state');const request=indexedDB.open('hello-world-027',1);request.onupgradeneeded=()=>request.result.createObjectStore('greetings',{keyPath:'id'});request.onsuccess=()=>{const db=request.result,tx=db.transaction('greetings','readwrite'),store=tx.objectStore('greetings');store.put({id:'primary',text:'Hello World'});tx.oncomplete=()=>{const read=db.transaction('greetings').objectStore('greetings').get('primary');read.onsuccess=()=>{state.textContent=`database / read: ${read.result.text}`;db.close()}}};request.onerror=()=>{state.textContent='database / unavailable'};
</script></body></html>
