<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Pixel Postcard</title>
<style>
:root{color:#fff4df;background:#24140d;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#24140d}.postcard{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #ffb35c;background:linear-gradient(150deg,#552c20,#24140d)}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#ffb35c;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#e9c4a0;font:12px monospace}.paper{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr .8fr;gap:26px;margin:9vh auto 0;width:min(82vw,980px);padding:24px;background:#f5dfbb;color:#382018;transform:rotate(-1deg);box-shadow:12px 16px 0 rgba(0,0,0,.2)}canvas{width:100%;height:280px;border:8px solid #382018;background:#e97850}.message{display:flex;flex-direction:column;justify-content:center}.message h1{margin:0;font-size:clamp(54px,9vw,112px);line-height:.8;letter-spacing:-.1em}.message small{margin-top:26px;font:12px monospace}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #ffb35c;padding:9px 14px;color:#ffb35c;background:transparent;font:12px monospace;cursor:pointer}@media(max-width:700px){.paper{grid-template-columns:1fr}.message h1{font-size:17vw}}</style>
</head><body><main class="postcard"><p class="label">056R / pixel postcard / canvas encoding</p><p class="state" id="state">postcard / image not yet mailed</p><section class="paper"><canvas id="canvas" width="700" height="360"></canvas><div class="message"><h1>Hello World</h1><small id="stamp">draw a stamp to encode this card</small></div></section><div class="controls"><button id="mail" type="button">mail postcard</button></div></main><script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),state=document.querySelector('#state'),stamp=document.querySelector('#stamp');function draw(){const g=ctx.createLinearGradient(0,0,700,360);g.addColorStop(0,'#ffcf70');g.addColorStop(1,'#e85f68');ctx.fillStyle=g;ctx.fillRect(0,0,700,360);ctx.strokeStyle='#fff4df';ctx.lineWidth=8;for(let x=-60;x<760;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+180,360);ctx.stroke()}}draw();document.querySelector('#mail').addEventListener('click',()=>{const data=canvas.toDataURL();stamp.textContent=`stamp / ${Math.round(data.length/1024)} KB png`;state.textContent='postcard / canvas encoded as a data URL'});
</script></body></html>
