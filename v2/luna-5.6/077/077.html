<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Twin Telegraph</title>
<style>
:root{color:#f1e8cf;background:#201712;font-family:Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#201712,#70412a)}.telegraph{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #e8bb68}.label,.state,.controls{position:relative;z-index:2}.label{margin:0;color:#e8bb68;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#d5b79a;font:12px monospace}.wires{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:8vw;margin:13vh auto 0;width:min(84vw,980px)}.station{min-height:260px;padding:22px;border:1px solid #e8bb68;background:#38251a}.station h2{margin:0;color:#e8bb68;font:11px monospace;letter-spacing:.15em}.station p{margin:65px 0 0;font-size:clamp(38px,6vw,74px);line-height:.8;letter-spacing:-.08em}.wire{position:absolute;left:25%;right:25%;top:50%;height:3px;background:#dc6570}.pulse{position:absolute;top:-8px;width:18px;height:18px;border-radius:50%;background:#f5efdc;box-shadow:0 0 18px #f5efdc}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #e8bb68;padding:9px 14px;color:#e8bb68;background:transparent;font:12px monospace;cursor:pointer}@media(max-width:700px){.wires{grid-template-columns:1fr;gap:18px}.wire{display:none}}</style>
</head><body><main class="telegraph"><p class="label">077 / twin telegraph / message channel</p><p class="state" id="state">line / both stations listening</p><section class="wires"><article class="station"><h2>ORIGIN</h2><p>Hello World</p></article><article class="station"><h2>RECEIVER</h2><p id="received">silent</p></article><i class="wire"><b class="pulse" id="pulse"></b></i></section><div class="controls"><button id="send" type="button">send greeting</button></div></main><script>
const channel=new MessageChannel(),received=document.querySelector('#received'),pulse=document.querySelector('#pulse'),state=document.querySelector('#state');channel.port1.onmessage=event=>{received.textContent=event.data;state.textContent='line / message arrived through the twin port';pulse.animate([{left:'0%'},{left:'100%'}],{duration:550,easing:'ease-in-out'})};channel.port1.start();document.querySelector('#send').addEventListener('click',()=>{state.textContent='line / sending through MessageChannel';channel.port2.postMessage('Hello World')});
</script></body></html>
