<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Render Station</title>
<style>
:root{color:#ecfff2;background:#0f211b;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f211b,#2f6b55)}.station{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #b4e06b;overflow:hidden}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#b4e06b;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#d1e7c5;font:12px monospace}.screen{position:relative;z-index:1;margin:9vh auto 0;width:min(72vw,820px);padding:28px;border:1px solid #f2c76e;background:#18372b;box-shadow:inset 0 0 0 12px rgba(180,224,107,.08)}.screen h1{margin:0;font-size:clamp(64px,13vw,158px);line-height:.8;letter-spacing:-.1em}.pixels{position:absolute;right:28px;top:28px;display:grid;grid-template-columns:repeat(5,10px);gap:5px}.pixels i{width:10px;height:10px;background:#b4e06b}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:12px}button{border:1px solid #b4e06b;padding:9px 14px;color:#b4e06b;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="station"><p class="label">046R / render station / runtime capacity</p><p class="state" id="state">runtime / reading hardware</p><div class="pixels" id="pixels"></div><section class="screen"><h1>Hello World</h1></section><div class="controls"><button id="scan" type="button">scan station</button></div></main><script>
const state=document.querySelector('#state'),pixels=document.querySelector('#pixels');function scan(){const cores=navigator.hardwareConcurrency||1,dpr=window.devicePixelRatio||1;pixels.replaceChildren(...Array.from({length:Math.min(25,cores*2)},()=>{const i=document.createElement('i');return i}));state.textContent=`runtime / ${cores} cores / ${dpr}× pixel ratio`}document.querySelector('#scan').addEventListener('click',scan);scan();
</script></body></html>
