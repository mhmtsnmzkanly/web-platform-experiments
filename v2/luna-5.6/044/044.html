<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Idle</title><style>
:root{font-family:Arial;background:#171323;color:#f1eaff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#171323,#51417b)}main{width:min(90vw,1080px);padding:46px;border:1px solid #c1adff;background:#251c3d}p{color:#c1adff;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#b6f4d1;font:14px monospace}</style><main><p>044 / idle callback / spare time</p><h1>Hello World</h1><div class="state">idle / queued</div></main><script>
const s=document.querySelector('.state'),run=d=>s.textContent=`idle / callback / ${Math.round(d.timeRemaining())}ms remaining`;if(requestIdleCallback)requestIdleCallback(run);else setTimeout(()=>run({timeRemaining:()=>0}),0);
</script>
