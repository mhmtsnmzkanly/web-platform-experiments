<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Media Query</title><style>
:root{font-family:Arial,sans-serif;background:#f5e9d0;color:#1d2630}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f5e9d0,#d88862)}.card{width:min(88vw,1080px);padding:46px;border:1px solid #1d2630;background:#fff6e5}p{margin:0 0 48px;color:#c24f3f;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{margin-top:48px;color:#c24f3f;font:14px monospace}@media (prefers-color-scheme: dark){:root{background:#111923;color:#f5e9d0}body{background:linear-gradient(135deg,#111923,#4d293c)}.card{background:#1b2633;border-color:#f5e9d0}.state,p{color:#f3af72}}</style></head><body><main class="card"><p>030 / media query / ambient preference</p><h1>Hello World</h1><div class="state">scheme / reading</div></main><script>
const query=matchMedia('(prefers-color-scheme: dark)'),state=document.querySelector('.state');const render=()=>{state.textContent=`scheme / ${query.matches?'dark':'light'} / native media state`};query.addEventListener('change',render);render();
</script></body></html>
