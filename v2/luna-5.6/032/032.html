<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — WebGL</title><style>
:root{font-family:Arial;background:#07111f;color:#e9fbff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f}main{width:min(90vw,1080px);padding:38px;border:1px solid #53e0ff;background:#0d2034}p{color:#53e0ff;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}canvas{display:block;width:100%;height:250px;margin-top:35px}h1{position:absolute;left:-9999px}.state{color:#ffcb6b;font:14px monospace}</style><main><p>032 / webgl / fragment field</p><h1>Hello World</h1><canvas width="1000" height="250"></canvas><div class="state">webgl / compiling</div></main><script>
const c=document.querySelector('canvas'),s=document.querySelector('.state'),gl=c.getContext('webgl');if(!gl)s.textContent='webgl / unavailable';else{const vs=gl.createShader(gl.VERTEX_SHADER),fs=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(vs,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');gl.shaderSource(fs,'precision mediump float;uniform vec2 r;void main(){vec2 u=gl_FragCoord.xy/r;float a=smoothstep(.02,.0,abs(sin(u.x*44.0)*.25-u.y+.5));gl_FragColor=vec4(.1,.85,.95,a);}') ;gl.compileShader(vs);gl.compileShader(fs);const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);gl.useProgram(p);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);gl.uniform2f(gl.getUniformLocation(p,'r'),c.width,c.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);s.textContent='webgl / fragment field / rendered';}
</script>
