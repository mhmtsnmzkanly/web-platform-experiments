<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Label Cabinet</title>
<style>
:root{color:#f7efda;background:#241b17;font-family:Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(125deg,#241b17,#69412d)}.cabinet{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f0c16b}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#f0c16b;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#ddc5a4;font:12px monospace}.drawers{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:12vh auto 0;width:min(82vw,940px)}.drawer{min-height:260px;padding:22px;border:1px solid #f0c16b;background:#3a271e;box-shadow:inset 0 -30px 0 rgba(0,0,0,.12)}.drawer h2{margin:0;color:#d76d7a;font:11px monospace;letter-spacing:.15em}.drawer p{margin-top:70px;font-size:clamp(34px,5vw,62px);line-height:.85;letter-spacing:-.08em}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:10px}select,button{border:1px solid #f0c16b;padding:9px 12px;color:#f0c16b;background:#241b17;font:12px monospace}button{cursor:pointer}@media(max-width:700px){.drawers{grid-template-columns:1fr}}</style>
</head><body><main class="cabinet"><p class="label">063R / label cabinet / display names</p><p class="state" id="state">cabinet / drawers awaiting locale</p><section class="drawers"><article class="drawer"><h2>phrase</h2><p>Hello World</p></article><article class="drawer"><h2>language</h2><p id="language">—</p></article><article class="drawer"><h2>region</h2><p id="region">—</p></article></section><div class="controls"><select id="locale"><option value="en">English</option><option value="tr">Türkçe</option><option value="fr">Français</option><option value="ja">日本語</option></select><button id="open" type="button">open drawers</button></div></main><script>
const locale=document.querySelector('#locale'),state=document.querySelector('#state'),language=document.querySelector('#language'),region=document.querySelector('#region');function open(){const names=new Intl.DisplayNames(locale.value,{type:'language'}),regions=new Intl.DisplayNames(locale.value,{type:'region'});language.textContent=names.of('en');region.textContent=regions.of('TR');state.textContent=`cabinet / ${locale.value} labels / drawers open`}document.querySelector('#open').addEventListener('click',open);open();
</script></body></html>
