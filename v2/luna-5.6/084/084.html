<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Locale Compass</title>
<style>
:root{color:#f4f0dc;background:#151d2a;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#3b5474,#151d2a 70%)}.compass{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #d7b75f}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#d7b75f;font-size:11px;letter-spacing:.18em}.state{margin-top:10px;color:#b5d5e6;font-size:12px}.face{position:relative;z-index:1;margin:8vh auto 0;width:min(62vw,700px);aspect-ratio:1;border:1px solid #d7b75f;border-radius:50%;display:grid;place-items:center;background:repeating-conic-gradient(from 0deg,transparent 0 14deg,rgba(215,183,95,.2) 15deg 16deg)}.face h1{margin:0;color:#f4f0dc;font:700 clamp(52px,9vw,110px)/.8 Arial,sans-serif;letter-spacing:-.1em;text-align:center}.needle{position:absolute;left:50%;top:50%;width:42%;height:3px;transform-origin:left center;transform:rotate(22deg);background:#e76778}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:10px}select{border:1px solid #d7b75f;padding:9px;color:#d7b75f;background:transparent;font:12px monospace}</style>
</head><body><main class="compass"><p class="label">084 / locale compass / intl locale</p><p class="state" id="state">compass / choose a language tag</p><section class="face"><i class="needle"></i><h1>Hello World</h1></section><div class="controls"><select id="tag"><option>en-US</option><option>tr-TR</option><option>fr-FR</option><option>ja-JP</option></select></div></main><script>
const tag=document.querySelector('#tag'),state=document.querySelector('#state'),needle=document.querySelector('.needle');function point(){const locale=new Intl.Locale(tag.value),angle=(locale.language.codePointAt(0)%360)-180;needle.style.transform=`rotate(${angle}deg)`;state.textContent=`compass / ${locale.baseName} / language ${locale.language} / region ${locale.region||'—'}`}tag.addEventListener('change',point);point();
</script></body></html>
