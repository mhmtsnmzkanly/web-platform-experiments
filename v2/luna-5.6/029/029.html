<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Fonts</title><style>
:root{font-family:Georgia,serif;background:#f3efe5;color:#1c2630}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f3efe5,#b9c7d1)}.card{width:min(88vw,1080px);padding:46px;border:1px solid #1c2630;background:#f8f5ec}p{margin:0 0 48px;color:#547080;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{margin-top:48px;color:#547080;font:14px monospace}</style></head><body><main class="card"><p>029 / fonts / readiness promise</p><h1>Hello World</h1><div class="state">fonts / waiting</div></main><script>
document.fonts.ready.then((fontSet)=>{document.querySelector('.state').textContent=`fonts / ready / ${fontSet.status}`}).catch(()=>{document.querySelector('.state').textContent='fonts / readiness error'});
</script></body></html>
