<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Online</title><style>
:root{font-family:Arial;background:#101c1b;color:#edfff8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101c1b,#2e7661)}main{width:min(90vw,1080px);padding:46px;border:1px solid #8ae9bd;background:#17382f}p{color:#8ae9bd;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#ffd274;font:14px monospace}</style><main><p>071 / online / connection state</p><h1>Hello World</h1><div class="state">network / reading</div></main><script>
const s=document.querySelector('.state'),render=()=>s.textContent=`network / ${navigator.onLine?'online':'offline'} / native state`;addEventListener('online',render);addEventListener('offline',render);render();
</script>
