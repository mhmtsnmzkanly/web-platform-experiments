<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Random</title><style>
:root{font-family:Arial;background:#20140f;color:#fff0df}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#a05b34,#20140f 70%)}main{width:min(90vw,1080px);padding:46px;border:1px solid #ffc36e;background:#392015}p{color:#ffc36e;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#afeccb;font:14px monospace}</style><main><p>065 / random values / byte field</p><h1>Hello World</h1><div class="state">random / filling</div></main><script>
const bytes=new Uint8Array(8);crypto.getRandomValues(bytes);const hex=[...bytes].map(x=>x.toString(16).padStart(2,'0')).join('');document.querySelector('.state').textContent=`random / ${hex} / secure bytes`;
</script>
