<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — History Carousel</title>
<style>
:root{color:#fff1d2;background:#1c1428;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#704f8e,#1c1428 70%)}.carousel{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f0bc68}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#f0bc68;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#d9c2e3;font:12px monospace}.stage{position:relative;z-index:1;margin:11vh auto 0;width:min(74vw,850px);height:310px;overflow:hidden;border-bottom:1px solid #f0bc68}.slide{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(62px,13vw,158px);line-height:.8;letter-spacing:-.1em;transition:transform .45s}.slide.old{transform:translateX(-120%)}.slide.new{transform:translateX(120%)}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:10px}button{border:1px solid #f0bc68;padding:9px 14px;color:#f0bc68;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="carousel"><p class="label">079 / history carousel / push state</p><p class="state" id="state">history / first card</p><section class="stage" id="stage"><div class="slide">Hello World</div></section><div class="controls"><button id="next" type="button">push next</button><button id="back" type="button">go back</button></div></main><script>
const stage=document.querySelector('#stage'),state=document.querySelector('#state');let page=0;function show(){state.textContent=`history / card ${page+1} / ${location.hash||'#origin'}`}addEventListener('popstate',()=>{page=Math.max(0,page-1);show()});document.querySelector('#next').addEventListener('click',()=>{page++;history.pushState({page},'',`#card-${page}`);const old=stage.querySelector('.slide');old.classList.add('old');const fresh=document.createElement('div');fresh.className='slide new';fresh.textContent='Hello World';stage.append(fresh);requestAnimationFrame(()=>fresh.classList.remove('new'));show()});document.querySelector('#back').addEventListener('click',()=>history.back());show();
</script></body></html>
