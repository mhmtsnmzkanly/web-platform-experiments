<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Locks</title><style>
:root{font-family:system-ui;background:#171d2d;color:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#171d2d,#3f5b8c)}main{width:min(90vw,1080px);padding:46px;border:1px solid #a8d1ff;background:#202f4b}p{color:#a8d1ff;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#ffce75;font:14px monospace}</style><main><p>038 / web locks / exclusive claim</p><h1>Hello World</h1><div class="state">lock / requesting</div></main><script>
const state=document.querySelector('.state');if(!navigator.locks)state.textContent='lock / unavailable';else navigator.locks.request('hello-world-038',async lock=>{state.textContent=`lock / ${lock.name} / acquired`;await new Promise(r=>setTimeout(r,20));state.textContent='lock / released'});
</script>
