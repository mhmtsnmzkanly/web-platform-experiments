<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Matrix Blueprint</title>
<style>
:root{color:#e5f4ff;background:#10202b;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#10202b,#26556a)}.blueprint{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #8bd7df;background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(139,215,223,.1) 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(139,215,223,.1) 40px)}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#8bd7df;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#f1c66d;font-size:12px}.board{position:relative;z-index:1;margin:10vh auto 0;width:min(78vw,900px);height:300px;border:1px solid #f1c66d}.board:before,.board:after{position:absolute;content:"";background:#8bd7df}.board:before{left:50%;top:0;bottom:0;width:1px}.board:after{top:50%;left:0;right:0;height:1px}.word{position:absolute;left:50%;top:50%;margin:0;transform-origin:center;transform:translate(-50%,-50%) rotate(var(--rotate,0deg)) skewX(var(--skew,0deg));color:#f5f1dc;font:700 clamp(60px,12vw,146px)/.8 Arial,sans-serif;letter-spacing:-.1em;white-space:nowrap}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:12px;align-items:center}.controls input{width:180px;accent-color:#f1c66d}</style>
</head><body><main class="blueprint"><p class="label">042R / matrix blueprint / dommatrix</p><p class="state" id="state">matrix / identity</p><section class="board"><h1 class="word" id="word">Hello World</h1></section><div class="controls"><label for="turn">turn <input id="turn" type="range" min="-25" max="25" value="0"></label></div></main><script>
const word=document.querySelector('#word'),state=document.querySelector('#state'),turn=document.querySelector('#turn');turn.addEventListener('input',()=>{const matrix=new DOMMatrix().rotate(Number(turn.value)).skewX(Number(turn.value)/2);word.style.transform=`translate(-50%,-50%) matrix(${matrix.a},${matrix.b},${matrix.c},${matrix.d},${matrix.e},${matrix.f})`;state.textContent=`matrix / a${matrix.a.toFixed(2)} / b${matrix.b.toFixed(2)}`});
</script></body></html>
