<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Parser Greenhouse</title>
<style>
:root{color:#eaf6df;background:#102419;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102419,#315c43)}.greenhouse{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #b5d36b}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#b5d36b;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin:10px 0;color:#d8e8c7;font:12px monospace}.beds{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:8vh}.bed{min-height:300px;padding:24px;border:1px solid #d17b51;background:#1a3223}.bed h2{margin:0;font-size:clamp(52px,9vw,108px);line-height:.8;letter-spacing:-.1em}.controls{display:flex;gap:12px;margin-top:30px}textarea{width:100%;height:74px;border:1px solid #b5d36b;padding:10px;color:#eaf6df;background:#102419;font:12px monospace}button{border:1px solid #d17b51;padding:9px 14px;color:#d17b51;background:transparent;font:12px monospace;cursor:pointer}@media(max-width:720px){.beds{grid-template-columns:1fr}}</style>
</head><body><main class="greenhouse"><p class="label">033R / parser greenhouse / domparser</p><p class="state" id="state">parser / seed ready</p><section class="beds"><div class="bed" id="parsed"><h2>Hello World</h2></div><div class="bed"><textarea id="markup" aria-label="Markup seed">&lt;h2&gt;Hello World&lt;/h2&gt;</textarea><button id="plant" type="button">plant fragment</button></div></section></main><script>
const markup=document.querySelector('#markup'),parsed=document.querySelector('#parsed'),state=document.querySelector('#state');document.querySelector('#plant').addEventListener('click',()=>{const doc=new DOMParser().parseFromString(markup.value,'text/html'),heading=doc.body.querySelector('h2');if(!heading){state.textContent='parser / expected an h2 seed';return}parsed.replaceChildren(document.importNode(heading,true));state.textContent=`parser / planted ${heading.textContent}`});
</script></body></html>
