<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Priority</title><style>
:root{font-family:system-ui,sans-serif;background:#20152d;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(120deg,#20152d,#542c61)}.card{width:min(88vw,1040px);padding:42px;border:1px solid #ff9f68;background:#2d1e3b}p{font:12px monospace;letter-spacing:.2em;color:#ff9f68;text-transform:uppercase;margin:0 0 45px}h1{margin:0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.status{margin-top:48px;color:#d7c2ef;font:14px monospace}.done{color:#a7efbd}</style></head><body><main class="card"><p>023 / task priority / staged paint</p><h1>Hello World</h1><div class="status">scheduler / queuing</div></main><script>
const status=document.querySelector('.status');const post=(label,priority)=>globalThis.scheduler?.postTask? scheduler.postTask(()=>label,{priority}):Promise.resolve(label);
post('scheduler / background', 'background').then((label)=>{status.textContent=label;return post('scheduler / user-visible','user-visible')}).then((label)=>{status.textContent=label;return post('scheduler / complete','user-blocking')}).then((label)=>{status.textContent=label;status.classList.add('done')});
</script></body></html>
