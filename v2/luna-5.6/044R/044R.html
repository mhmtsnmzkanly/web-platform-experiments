<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Idle Garden</title>
<style>
:root{color:#eff7e7;background:#152119;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#152119,#456840)}.garden{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #c2dc7d;overflow:hidden}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#c2dc7d;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#d2e3b6;font:12px monospace}.greeting{position:relative;z-index:1;margin:12vh 0 0;color:#eff7e7;font-size:clamp(64px,13vw,158px);line-height:.8;letter-spacing:-.1em}.plot{position:relative;z-index:1;display:flex;align-items:end;justify-content:center;gap:24px;height:260px;margin-top:3vh;border-bottom:1px solid #c2dc7d}.sprout{width:28px;height:var(--h);border-radius:100% 0;background:#c2dc7d;transform:rotate(var(--r));transform-origin:bottom;transition:height .5s}.sprout:nth-child(2n){background:#f0b35b}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:12px}button{border:1px solid #c2dc7d;padding:9px 14px;color:#c2dc7d;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="garden"><p class="label">044R / idle garden / requestIdleCallback</p><p class="state" id="state">garden / waiting for idle time</p><h1 class="greeting">Hello World</h1><section class="plot" id="plot"><i class="sprout" style="--h:90px;--r:-26deg"></i><i class="sprout" style="--h:160px;--r:20deg"></i><i class="sprout" style="--h:230px;--r:-18deg"></i><i class="sprout" style="--h:120px;--r:24deg"></i></section><div class="controls"><button id="grow" type="button">grow during idle</button></div></main><script>
const state=document.querySelector('#state'),sprouts=[...document.querySelectorAll('.sprout')];function grow(deadline){let i=0;while((deadline.timeRemaining()>1||deadline.didTimeout)&&i<sprouts.length){sprouts[i].style.height=`${120+i*42}px`;i++}state.textContent=`garden / ${i} shoots tended during idle`}document.querySelector('#grow').addEventListener('click',()=>{state.textContent='garden / queueing idle work';if('requestIdleCallback'in window)requestIdleCallback(grow,{timeout:800});else setTimeout(()=>grow({timeRemaining:()=>99,didTimeout:true}),0)});if('requestIdleCallback'in window)requestIdleCallback(grow,{timeout:800});
</script></body></html>
