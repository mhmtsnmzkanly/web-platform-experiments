<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — FileReader</title><style>
:root{font-family:Georgia,serif;background:#eee5d4;color:#222019}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eee5d4,#bc8065)}main{width:min(90vw,1080px);padding:46px;border:1px solid #222019;background:#faf2df}p{color:#a54d3d;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#a54d3d;font:14px monospace}</style><main><p>060 / filereader / local bytes</p><h1>Hello World</h1><div class="state">reader / opening</div></main><script>
const r=new FileReader(),s=document.querySelector('.state');r.onload=()=>s.textContent=`reader / ${r.result.slice(0,24)}… / data url`;r.onerror=()=>s.textContent='reader / unavailable';r.readAsDataURL(new Blob(['Hello World'],{type:'text/plain'}));
</script>
