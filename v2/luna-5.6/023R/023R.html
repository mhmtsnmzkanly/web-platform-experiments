<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Priority Runway</title>
<style>
:root{color:#fff;background:#181226;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#181226,#542c61)}.runway{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #ff9f68;background:#241a36;overflow:hidden}.runway:before{position:absolute;left:10%;right:10%;top:14%;bottom:8%;border:1px dashed rgba(255,159,104,.5);transform:perspective(500px) rotateX(58deg);content:""}.label,.status{position:relative;z-index:1;margin:0;color:#ff9f68;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.status{margin-top:10px;color:#d7c2ef;letter-spacing:.08em;text-transform:none}.lanes{position:relative;z-index:1;display:grid;gap:18px;margin:12vh 7% 0}.lane{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:16px}.lane span{color:#d7c2ef;font:12px monospace}.track{height:42px;border-bottom:1px solid #ff9f68}.runner{display:block;width:50px;height:30px;background:#a7efbd;transition:transform 600ms ease}.lane:nth-child(2) .runner{background:#f4bf63}.lane:nth-child(3) .runner{background:#ff9f68}.echo{position:relative;z-index:1;margin:32px 7% 0;color:#d7c2ef;font:12px monospace}.controls{position:absolute;z-index:2;right:28px;bottom:28px;display:flex;gap:12px}button{border:1px solid #ff9f68;padding:9px 14px;color:#fff;background:transparent;font:12px monospace;cursor:pointer}button:hover{background:#ff9f68;color:#241a36}</style>
</head><body><main class="runway"><p class="label">023R / priority runway / staged paint</p><p class="status" id="status">scheduler / boarding</p><section class="lanes"><div class="lane"><span>background</span><div class="track"><i class="runner"></i></div></div><div class="lane"><span>user-visible</span><div class="track"><i class="runner"></i></div></div><div class="lane"><span>blocking</span><div class="track"><i class="runner"></i></div></div></section><p class="echo">Hello World / payload ready for dispatch</p><div class="controls"><button id="dispatch" type="button">dispatch tasks</button></div></main><script>
const status=document.querySelector('#status'),runners=[...document.querySelectorAll('.runner')];
async function dispatch(){const post=(label,priority)=>{try{return typeof globalThis.scheduler?.postTask==='function'?globalThis.scheduler.postTask(()=>label,{priority}).catch(()=>label):Promise.resolve(label)}catch{return Promise.resolve(label)}};for(const [i,item] of [['background','background'],['user-visible','user-visible'],['user-blocking','user-blocking']].entries()){const label=await post(`scheduler / ${item}`,item);status.textContent=label;runners[i].style.transform='translateX(calc(100% + 500px))';await new Promise(r=>setTimeout(r,180))}status.textContent='scheduler / complete'}
document.querySelector('#dispatch').addEventListener('click',()=>{runners.forEach(r=>r.style.transform='');dispatch().catch(()=>{status.textContent='scheduler / complete'})});dispatch().catch(()=>{status.textContent='scheduler / complete'});
</script></body></html>
