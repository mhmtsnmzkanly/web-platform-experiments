<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Scroll Timeline</title><style>
:root{font-family:Arial,sans-serif;color:#f4ead7;background:#10151b}*{box-sizing:border-box}body{margin:0;min-height:240vh;background:linear-gradient(#10151b 0 70%,#d36b42 100%)}.rail{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}.card{width:min(88vw,1100px);padding:40px;border:1px solid #e3b36d;background:#18222b;animation:reveal linear both;animation-timeline:scroll(root);animation-range:0 60%}h1{margin:0;font-size:clamp(70px,14vw,170px);line-height:.8;letter-spacing:-.1em}p{font:12px monospace;letter-spacing:.15em;color:#e3b36d;text-transform:uppercase}@keyframes reveal{from{opacity:.82;transform:translateY(8vh) scale(.95);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}} </style></head><body><div class="rail"><main class="card"><p>021 / scroll timeline / native progress</p><h1>Hello World</h1></main></div></body></html>
