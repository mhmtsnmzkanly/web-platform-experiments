<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Refraction</title>
  <style>
    :root {
      background: #0e3035;
      color: #e6f1df;
      font-family: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 40%, #386e6b 0 2%, transparent 32%),
        #0e3035;
    }

    .reservoir {
      width: min(92vw, 1120px);
      padding: 40px 48px 48px;
      border: 1px solid #b8d7a7;
      background: #17464a;
    }

    .label {
      margin: 0 0 42px;
      color: #f0a16d;
      font: 12px/1.2 monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    text {
      fill: #e6f1df;
      font: 700 136px Georgia, "Times New Roman", serif;
      letter-spacing: -2px;
    }

    .waterline {
      fill: none;
      stroke: #f0a16d;
      stroke-width: 3;
      stroke-dasharray: 4 18;
    }

    .note {
      margin: 14px 0 0;
      color: #b8d7a7;
      font: 13px/1.4 monospace;
      text-align: right;
    }
  </style>
</head>
<body>
  <main class="reservoir">
    <p class="label">014 / refraction / displacement field</p>
    <svg viewBox="0 0 1000 420" role="img" aria-label="Hello World refracted through procedural water">
      <defs>
        <filter id="ripple" x="-10%" y="-20%" width="120%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018 0.05" numOctaves="2" seed="14" result="noise"></feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="B"></feDisplacementMap>
        </filter>
      </defs>
      <path class="waterline" d="M 50 300 C 250 260, 450 340, 650 292 S 850 270, 950 305"></path>
      <text x="500" y="250" text-anchor="middle" filter="url(#ripple)">Hello World</text>
    </svg>
    <p class="note">source graphic / seeded noise / displaced glyphs</p>
  </main>
</body>
</html>
