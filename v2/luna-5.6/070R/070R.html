<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Input Observatory</title>
<style>
:root{color:#edf4ff;background:#121529;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#121529,#3f477e)}.observatory{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #b4d9ff}.label,.state{position:relative;z-index:1}.label{margin:0;color:#b4d9ff;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#f0c46d;font:12px monospace}.dish{position:relative;z-index:1;margin:11vh auto 0;width:min(70vw,800px);height:330px;border:1px solid #b4d9ff;border-radius:50% 50% 12px 12px;transform:perspective(500px) rotateX(28deg);background:repeating-radial-gradient(ellipse at center,#283362 0 8px,#172041 9px 16px)}.dish h1{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotateX(-28deg);margin:0;white-space:nowrap;color:#edf4ff;font-size:clamp(56px,11vw,140px);line-height:.8;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #f0c46d;padding:9px 14px;color:#f0c46d;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="observatory"><p class="label">070R / input observatory / pointer media</p><p class="state" id="state">dish / sampling input hardware</p><section class="dish"><h1>Hello World</h1></section><div class="controls"><button id="scan" type="button">scan input</button></div></main><script>
const state=document.querySelector('#state');function scan(){const fine=matchMedia('(pointer: fine)').matches,hover=matchMedia('(hover: hover)').matches;state.textContent=`dish / ${fine?'fine':'coarse'} pointer / ${hover?'hover':'touch'} atmosphere`}document.querySelector('#scan').addEventListener('click',scan);matchMedia('(pointer: fine)').addEventListener?.('change',scan);scan();
</script></body></html>
