<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Point Field</title>
  <style>
    :root {
      background: #17191d;
      color: #f2c46d;
      font-family: monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #17191d;
    }

    figure {
      width: min(94vw, 1120px);
      margin: 0;
      padding: 30px 34px 26px;
      border: 1px solid #f2c46d;
      background: #23262d;
    }

    h1 {
      margin: 0 0 18px;
      color: #f2c46d;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #17191d;
    }

    figcaption {
      margin-top: 16px;
      color: #9ca6b4;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <figure>
    <h1>Hello World</h1>
    <canvas width="1000" height="420" aria-label="Hello World reconstructed as a sampled point field"></canvas>
    <figcaption>canvas / alpha samples / reconstructed greeting</figcaption>
  </figure>
  <script>
    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d');
    const source = document.createElement('canvas');
    source.width = canvas.width;
    source.height = canvas.height;
    const sourceContext = source.getContext('2d', { willReadFrequently: true });

    sourceContext.fillStyle = '#f2c46d';
    sourceContext.font = '700 150px Arial, Helvetica, sans-serif';
    sourceContext.textAlign = 'center';
    sourceContext.textBaseline = 'middle';
    sourceContext.fillText('Hello World', source.width / 2, source.height / 2);

    const pixels = sourceContext.getImageData(0, 0, source.width, source.height).data;
    context.fillStyle = '#17191d';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = '#f2c46d';
    const step = 7;
    for (let y = 0; y < source.height; y += step) {
      for (let x = 0; x < source.width; x += step) {
        const alpha = pixels[(y * source.width + x) * 4 + 3];
        if (alpha > 40) {
          const radius = 1.2 + (alpha / 255) * 2.1;
          context.beginPath();
          context.arc(x, y, radius, 0, Math.PI * 2);
          context.fill();
        }
      }
    }
  </script>
</body>
</html>
