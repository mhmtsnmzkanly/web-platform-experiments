<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Hit Test Arena</title>
<style>
:root{color:#f5ead6;background:#211812;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#744731,#211812 68%)}.arena{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #efb25e;overflow:hidden}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#efb25e;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#d5b9a4;font:12px monospace}.target{position:relative;z-index:1;margin:10vh auto 0;width:min(72vw,820px);padding:34px;border:1px solid #9de0c5;background:#38261d;text-align:center;cursor:crosshair}.target h1{margin:0;font-size:clamp(64px,13vw,158px);line-height:.8;letter-spacing:-.1em}.cross{position:absolute;width:18px;height:18px;border:2px solid #efb25e;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #efb25e;padding:9px 14px;color:#efb25e;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="arena"><p class="label">052R / hit test arena / point geometry</p><p class="state" id="state">hit-test / place the cursor</p><section class="target" id="target"><h1>Hello World</h1></section><i class="cross" id="cross"></i><div class="controls"><button id="center" type="button">test center</button></div></main><script>
const target=document.querySelector('#target'),cross=document.querySelector('#cross'),state=document.querySelector('#state'),arena=document.querySelector('.arena');function test(x,y){cross.style.left=`${x}px`;cross.style.top=`${y}px`;const hit=document.elementFromPoint(x,y),box=target.getBoundingClientRect();state.textContent=`hit-test / ${hit===target||target.contains(hit)?'greeting':'arena'} / ${Math.round(box.width)}×${Math.round(box.height)}`}arena.addEventListener('pointermove',e=>test(e.clientX,e.clientY));document.querySelector('#center').addEventListener('click',()=>{const box=target.getBoundingClientRect();test(box.left+box.width/2,box.top+box.height/2)});
</script></body></html>
