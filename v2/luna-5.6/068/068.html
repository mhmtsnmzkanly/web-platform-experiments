<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Viewport</title><style>
:root{font-family:Arial;background:#17201c;color:#eafff1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#17201c,#3d7658)}main{width:min(90vw,1080px);padding:46px;border:1px solid #9be9bc;background:#203b2b}p{color:#9be9bc;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#ffd374;font:14px monospace}</style><main><p>068 / visual viewport / live window</p><h1>Hello World</h1><div class="state">viewport / reading</div></main><script>
const v=visualViewport,s=document.querySelector('.state'),render=()=>s.textContent=`viewport / ${Math.round(v.width)}×${Math.round(v.height)} / scale ${v.scale}`;render();v.addEventListener('resize',render);
</script>
