<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Signal Ribbon</title>
<style>
:root{color:#f7f2db;background:#17131f;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17131f}.loom{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #d9a85e;background:repeating-linear-gradient(90deg,transparent 0 42px,rgba(217,168,94,.07) 43px 44px)}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#d9a85e;font-size:11px;letter-spacing:.18em}.state{margin-top:10px;color:#b7cdb8;font-size:12px}.ribbon{position:relative;z-index:1;margin:12vh auto 0;width:min(84vw,960px);height:210px;display:flex;align-items:center;overflow:hidden;border-block:1px solid #d9a85e}.ribbon i{width:12px;height:100%;background:#e85d75;transform:skewX(-18deg);margin-right:12px;transition:height .2s}.ribbon h1{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:#f7f2db;font:700 clamp(54px,11vw,136px)/.8 Arial,sans-serif;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:10px}button{border:1px solid #d9a85e;padding:9px 14px;color:#d9a85e;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="loom"><p class="label">076 / signal ribbon / text bytes</p><p class="state" id="state">ribbon / waiting for a binary weave</p><section class="ribbon" id="ribbon"><h1>Hello World</h1></section><div class="controls"><button id="weave" type="button">encode / decode</button></div></main><script>
const text='Hello World',ribbon=document.querySelector('#ribbon'),state=document.querySelector('#state');document.querySelector('#weave').addEventListener('click',()=>{const bytes=new TextEncoder().encode(text),roundTrip=new TextDecoder().decode(bytes);ribbon.querySelectorAll('i').forEach(node=>node.remove());bytes.forEach(byte=>{const line=document.createElement('i');line.style.height=`${22+(byte/255)*78}%`;ribbon.prepend(line)});state.textContent=`ribbon / ${bytes.length} UTF-8 bytes / decoded: ${roundTrip}`});
</script></body></html>
