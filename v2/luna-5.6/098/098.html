<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Storage Reservoir</title>
<style>
:root{color:#eaf8ff;background:#0c2027;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#0c2027,#1d6870)}.reservoir{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #8be0d6}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#8be0d6;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#f0c36a;font:12px monospace}.tank{position:relative;z-index:1;margin:8vh auto 0;width:min(58vw,660px);height:410px;border:5px solid #8be0d6;border-radius:22% 22% 8% 8%;overflow:hidden;background:linear-gradient(transparent 0 54%,rgba(139,224,214,.2) 55%)}.tank:before{position:absolute;left:15%;right:15%;bottom:0;height:44%;background:#60c8c0;opacity:.5;content:"";transition:height .4s}.tank h1{position:absolute;inset:0;z-index:1;display:grid;place-items:center;margin:0;color:#f2f0d8;font-size:clamp(52px,10vw,126px);line-height:.8;letter-spacing:-.1em;text-align:center}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #f0c36a;padding:9px 14px;color:#f0c36a;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="reservoir"><p class="label">098 / storage reservoir / quota estimate</p><p class="state" id="state">reservoir / level unknown</p><section class="tank"><h1>Hello World</h1></section><div class="controls"><button id="measure" type="button">measure reservoir</button></div></main><script>
const state=document.querySelector('#state'),tank=document.querySelector('.tank');document.querySelector('#measure').addEventListener('click',async()=>{const estimate=await navigator.storage.estimate();const ratio=estimate.quota?Math.min(1,(estimate.usage||0)/estimate.quota):0;tank.style.setProperty('--level',ratio);tank.style.setProperty('background',`linear-gradient(transparent 0 ${Math.round((1-ratio)*100)}%,rgba(139,224,214,.28) ${Math.round((1-ratio)*100)}%)`);state.textContent=`reservoir / ${Math.round((estimate.usage||0)/1024)} KB used / ${Math.round((estimate.quota||0)/1024)} KB quota`});
</script></body></html>
