<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Spotlight</title>
  <style>
    :root {
      color: #f7e9d2;
      background: #14161f;
      font-family: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 48%, #3c3351 0 12%, transparent 40%),
        #14161f;
    }

    .stage {
      color: #9e91b8;
      font: 12px/1.2 monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    dialog {
      width: min(78vw, 860px);
      padding: 58px 64px 64px;
      border: 1px solid #e27b5f;
      color: #f7e9d2;
      background: #252238;
      box-shadow: 0 0 0 18px #252238, 0 0 0 19px #e27b5f, 26px 30px 0 #0b0d13;
    }

    dialog::backdrop {
      background: rgba(20, 22, 31, 0.78);
      backdrop-filter: blur(5px);
    }

    .eyebrow {
      margin: 0 0 54px;
      color: #e27b5f;
      font: 12px/1.2 monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 12vw, 150px);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    .status {
      margin: 44px 0 0;
      color: #b9adc9;
      font: 13px/1.5 monospace;
    }
  </style>
</head>
<body>
  <main class="stage">native top layer / focused greeting</main>
  <dialog id="spotlight">
    <p class="eyebrow">008 / spotlight / modal surface</p>
    <h1>Hello World</h1>
    <p class="status">the browser moved the subject above the document</p>
  </dialog>
  <script>
    document.querySelector('#spotlight').showModal();
  </script>
</body>
</html>
