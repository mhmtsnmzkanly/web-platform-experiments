<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Units</title>
  <style>
    :root {
      background: #202a24;
      color: #eff2df;
      font-family: monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #202a24;
    }

    .board {
      width: min(90vw, 1040px);
      padding: 42px 48px 52px;
      border: 1px solid #d9e56d;
      background: #2e3c31;
    }

    .label {
      margin: 0 0 56px;
      color: #d9e56d;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      display: flex;
      align-items: end;
      gap: 20px;
      min-height: 230px;
      margin: 0;
      color: #eff2df;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(72px, 15vw, 174px);
      line-height: 0.8;
      letter-spacing: -0.1em;
    }

    .unit {
      display: inline-block;
      padding: 18px 20px 12px;
      background: #d9e56d;
      color: #202a24;
      transform: translateY(0);
    }

    .unit:nth-of-type(2) {
      background: #ee8b3f;
      transform: translateY(-34px);
    }

    .note {
      margin: 54px 0 0;
      color: #b8c4b4;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="board">
    <p class="label">012 / units / language boundaries</p>
    <h1 id="greeting">Hello World</h1>
    <p class="note">segmenter boundaries become visual tiles</p>
  </main>
  <script>
    const heading = document.querySelector('#greeting');
    const source = heading.textContent;
    const segmenter = new Intl.Segmenter('en', { granularity: 'word' });
    const fragment = document.createDocumentFragment();
    for (const item of segmenter.segment(source)) {
      if (item.isWordLike) {
        const unit = document.createElement('span');
        unit.className = 'unit';
        unit.textContent = item.segment;
        fragment.append(unit);
      } else {
        fragment.append(document.createTextNode(item.segment));
      }
    }
    heading.replaceChildren(fragment);
  </script>
</body>
</html>
