<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World — Silence Field</title>
  <style>
    :root { color: #5b2632; background: #f3ead8; font-family: Georgia, "Times New Roman", serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f3ead8; }
    .page { width: min(94vw, 1180px); min-height: min(84vh, 680px); padding: 30px 5vw 42px; border: 1px solid #5b2632; background: #fff8e9; }
    .label, .note { margin: 0; color: #b75c43; font: 11px/1.4 monospace; letter-spacing: .18em; text-transform: uppercase; }
    .note { clear: both; padding-top: 30px; color: #b75c43; letter-spacing: .08em; text-transform: none; }
    .shape { float: left; width: var(--orbit, 42%); height: 310px; margin: 12px 34px 18px 0; shape-outside: ellipse(48% 43% at 50% 50%); clip-path: ellipse(48% 43% at 50% 50%); background: #b75c43; transition: width 300ms ease, background 300ms ease; }
    h1 { margin: 12vh 0 0; color: #5b2632; font-size: clamp(72px, 13vw, 158px); line-height: .8; letter-spacing: -.1em; }
    .controls { clear: both; display: flex; align-items: center; gap: 16px; padding-top: 34px; color: #b75c43; font: 12px monospace; }
    input { width: min(300px, 42vw); accent-color: #5b2632; }
  </style>
</head>
<body>
  <main class="page">
    <p class="label">015R / silence field / shape exclusion</p>
    <div class="shape" aria-hidden="true"></div>
    <h1>Hello World</h1>
    <p class="note">the reserved silence can expand until the greeting has to reroute</p>
    <label class="controls" for="orbit">resize the silence <input id="orbit" type="range" min="26" max="58" value="42"></label>
  </main>
  <script>
    const page = document.querySelector('.page');
    const orbit = document.querySelector('#orbit');
    orbit.addEventListener('input', () => page.style.setProperty('--orbit', `${orbit.value}%`));
  </script>
</body>
</html>
