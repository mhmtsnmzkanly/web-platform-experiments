<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Performance</title><style>
:root{font-family:Arial;background:#17130d;color:#fff5dc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#8a612d,#17130d 70%)}main{width:min(90vw,1080px);padding:46px;border:1px solid #f4c56b;background:#302312}p{color:#f4c56b;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#b5f2ca;font:14px monospace}</style><main><p>039 / performance / measured interval</p><h1>Hello World</h1><div class="state">measure / pending</div></main><script>
performance.mark('hello-start');for(let i=0;i<10000;i++)Math.sqrt(i);performance.mark('hello-end');performance.measure('hello-work','hello-start','hello-end');const m=performance.getEntriesByName('hello-work')[0];document.querySelector('.state').textContent=`measure / ${m.duration.toFixed(3)} ms / performance timeline`;
</script>
