<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Range</title><style>
:root{font-family:Georgia,serif;background:#efe4cc;color:#282019}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#efe4cc,#c07854)}main{width:min(90vw,1080px);padding:46px;border:1px solid #282019;background:#fbf1dc}p{color:#a8493d;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#a8493d;font:14px monospace}</style><main><p>054 / range / text geometry</p><h1 id="greeting">Hello World</h1><div class="state">range / measuring</div></main><script>
const node=document.querySelector('#greeting').firstChild,range=new Range();range.selectNodeContents(node);const box=range.getBoundingClientRect();document.querySelector('.state').textContent=`range / ${Math.round(box.width)} × ${Math.round(box.height)} px`;
</script>
