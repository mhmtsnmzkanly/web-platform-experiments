<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Lifeline</title>
<style>
:root{color:#f4f0e6;background:#15191d;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#15191d,#3f2932)}.lifeline{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f0a16d;overflow:hidden}.lifeline:before{position:absolute;left:8%;right:8%;top:50%;height:1px;background:#f0a16d;content:""}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#f0a16d;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#c8b9c4;font:12px monospace}.core{position:relative;z-index:1;margin:18vh auto 0;width:min(82vw,940px);padding:28px;border:1px solid #8ee3c2;background:#1d262b}.core h1{margin:0;font-size:clamp(68px,14vw,170px);line-height:.8;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:12px}button{border:1px solid #f0a16d;padding:9px 14px;color:#f0a16d;background:transparent;font:12px monospace;cursor:pointer}button:hover{background:#f0a16d;color:#15191d}.cut{animation:cut .5s ease}@keyframes cut{50%{opacity:.15;transform:translateX(28px)}}</style>
</head><body><main class="lifeline"><p class="label">037R / lifeline / abort controller</p><p class="state" id="state">request / ready</p><section class="core" id="core"><h1>Hello World</h1></section><div class="controls"><button id="start" type="button">start signal</button><button id="abort" type="button">abort signal</button></div></main><script>
const state=document.querySelector('#state'),core=document.querySelector('#core');let controller=null;document.querySelector('#start').addEventListener('click',()=>{controller=new AbortController();state.textContent='request / travelling';core.classList.remove('cut');setTimeout(()=>{if(!controller.signal.aborted){state.textContent='request / arrived';core.animate([{transform:'scale(.98)'},{transform:'scale(1)'}],{duration:400})}},900)});document.querySelector('#abort').addEventListener('click',()=>{if(controller){controller.abort();state.textContent='request / aborted';core.classList.add('cut')}}); 
</script></body></html>
