<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Backstage Projector</title>
<style>
:root{color:#f4f0d8;background:#16131f;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#594175,#16131f 70%)}.theatre{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f2c26b}.label,.state,.controls{position:relative;z-index:2}.label{margin:0;color:#f2c26b;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#cdbbe6;font:12px monospace}.stage{position:relative;z-index:1;margin:11vh auto 0;width:min(78vw,900px);height:360px;background:#211b31;border:1px solid #cdbbe6;overflow:hidden}.stage:before{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(242,194,107,.35),transparent 38%);content:""}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.stage h1{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-size:clamp(60px,12vw,146px);line-height:.8;letter-spacing:-.1em;text-shadow:0 0 22px #f2c26b}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #f2c26b;padding:9px 14px;color:#f2c26b;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="theatre"><p class="label">058R / backstage projector / offscreen canvas</p><p class="state" id="state">stage / projector cold</p><section class="stage"><canvas id="screen" width="900" height="360"></canvas><h1>Hello World</h1></section><div class="controls"><button id="project" type="button">project light</button></div></main><script>
const canvas=document.querySelector('#screen'),state=document.querySelector('#state');document.querySelector('#project').addEventListener('click',()=>{try{const off=canvas.transferControlToOffscreen(),ctx=off.getContext('2d');ctx.fillStyle='rgba(242,194,107,.18)';ctx.fillRect(0,0,900,360);for(let i=0;i<14;i++){ctx.beginPath();ctx.arc(450,170,30+i*18,0,Math.PI*2);ctx.strokeStyle=`rgba(242,194,107,${.42-i*.02})`;ctx.stroke()}state.textContent='stage / light painted backstage on OffscreenCanvas'}catch(error){state.textContent=`stage / projector fallback / ${error.name}`}});
</script></body></html>
