<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Archive Drawer</title>
<style>
:root{color:#f8ecd5;background:#211811;font-family:Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 15%,#97543d,#211811 60%)}.archive{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:30px;border:1px solid #f1c56c;background:#32231b;overflow:hidden}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#f1c56c;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:12px;color:#d7bda1;font:13px monospace}.drawer{position:absolute;left:8%;right:8%;bottom:16%;height:42%;padding:28px;border:1px solid #f1c56c;background:#4a3022;transform:perspective(700px) rotateX(22deg);transform-origin:bottom;box-shadow:0 30px 0 #1b130e}.drawer h1{margin:0;font-size:clamp(66px,13vw,156px);line-height:.8;letter-spacing:-.1em}.controls{position:absolute;right:30px;bottom:30px;display:flex;gap:12px}button{border:1px solid #f1c56c;padding:9px 14px;color:#f1c56c;background:transparent;font:12px monospace;cursor:pointer}button:hover{background:#f1c56c;color:#211811}</style>
</head><body><main class="archive"><p class="label">027R / archive drawer / indexeddb</p><p class="state" id="state">database / opening vault</p><section class="drawer"><h1>Hello World</h1></section><div class="controls"><button id="save" type="button">save record</button><button id="read" type="button">read record</button></div></main><script>
const state=document.querySelector('#state'),request=indexedDB.open('hello-world-027r',1);request.onupgradeneeded=()=>request.result.createObjectStore('greetings',{keyPath:'id'});request.onsuccess=()=>{const db=request.result;state.textContent='database / vault ready';document.querySelector('#save').onclick=()=>{const tx=db.transaction('greetings','readwrite');tx.objectStore('greetings').put({id:'primary',text:'Hello World',saved:Date.now()});tx.oncomplete=()=>state.textContent='database / record sealed'};document.querySelector('#read').onclick=()=>{const read=db.transaction('greetings').objectStore('greetings').get('primary');read.onsuccess=()=>state.textContent=read.result?`database / read: ${read.result.text}`:'database / empty drawer'}};request.onerror=()=>state.textContent='database / unavailable';
</script></body></html>
