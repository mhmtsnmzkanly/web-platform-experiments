<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — XML X-Ray</title>
<style>
:root{color:#e8eef5;background:#121b25;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 30%,#35566d,#121b25 64%)}.xray{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #7fd4d0}.label,.readout,.controls{position:relative;z-index:1}.label{margin:0;color:#7fd4d0;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.readout{margin-top:10px;color:#f3bb65;font-size:12px}.specimen{position:relative;z-index:1;margin:12vh 8% 0;padding:30px;border:1px solid #f3bb65;background:#192733;box-shadow:14px 14px 0 #0b1117}.specimen h1{margin:0;color:#e8eef5;font:700 clamp(66px,13vw,158px)/.8 Arial,sans-serif;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:12px}button{border:1px solid #7fd4d0;padding:9px 14px;color:#7fd4d0;background:transparent;font:12px monospace;cursor:pointer}pre{position:relative;z-index:1;max-height:120px;overflow:auto;margin:28px 0 0;padding:14px;color:#f3bb65;background:#0d151e;font-size:11px;white-space:pre-wrap}</style>
</head><body><main class="xray"><p class="label">034R / xml x-ray / serializer</p><p class="readout" id="readout">serializer / specimen loaded</p><section class="specimen" id="specimen"><h1>Hello World</h1></section><pre id="code"></pre><div class="controls"><button id="scan" type="button">scan structure</button></div></main><script>
const specimen=document.querySelector('#specimen'),code=document.querySelector('#code'),readout=document.querySelector('#readout');function scan(){const xml=new XMLSerializer().serializeToString(specimen);code.textContent=xml;readout.textContent=`serializer / ${xml.length} characters exposed`}document.querySelector('#scan').addEventListener('click',scan);scan();
</script></body></html>
