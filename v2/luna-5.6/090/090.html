<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Fuse Clock</title>
<style>
:root{color:#f6efd9;background:#1e1512;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#1e1512,#743e28)}.fuse{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f0bc64}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#f0bc64;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#e5ba93;font:12px monospace}.coil{position:relative;z-index:1;margin:12vh auto 0;width:min(78vw,900px);height:220px;border-bottom:10px solid #f0bc64}.coil:before{position:absolute;left:8%;right:8%;top:80px;height:40px;border:4px dotted #e86468;border-radius:50%;content:""}.coil h1{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-size:clamp(60px,13vw,156px);line-height:.8;letter-spacing:-.1em}.spark{position:absolute;right:10%;top:50px;width:20px;height:20px;border-radius:50%;background:#f4f0da;box-shadow:0 0 26px #f4f0da;transition:right 2s linear}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:10px}button{border:1px solid #f0bc64;padding:9px 14px;color:#f0bc64;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="fuse"><p class="label">090 / fuse clock / abort signal timeout</p><p class="state" id="state">fuse / dormant</p><section class="coil"><i class="spark" id="spark"></i><h1>Hello World</h1></section><div class="controls"><button id="ignite" type="button">ignite 2-second fuse</button></div></main><script>
const state=document.querySelector('#state'),spark=document.querySelector('#spark');document.querySelector('#ignite').addEventListener('click',async()=>{const signal=AbortSignal.timeout(2000);spark.style.right='78%';state.textContent='fuse / burning / AbortSignal timeout armed';try{await new Promise((resolve,reject)=>{const timer=setTimeout(resolve,4000);signal.addEventListener('abort',()=>{clearTimeout(timer);reject(signal.reason)},{once:true})});state.textContent='fuse / completed'}catch(error){state.textContent=`fuse / cut by ${error.name}`}});
</script></body></html>
