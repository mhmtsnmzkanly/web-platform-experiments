<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Tree Museum</title>
<style>
:root{color:#f1f2dd;background:#14231b;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#14231b,#356248)}.museum{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #c8e47b}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#c8e47b;font-size:11px;letter-spacing:.18em}.state{margin-top:10px;color:#bad4b1;font-size:12px}.tree{position:relative;z-index:1;margin:9vh auto 0;width:min(80vw,930px);height:400px;border-bottom:5px solid #c8e47b}.tree h1{position:absolute;left:50%;top:30%;transform:translateX(-50%);margin:0;white-space:nowrap;color:#f1f2dd;font:700 clamp(56px,12vw,144px)/.8 Arial,sans-serif;letter-spacing:-.1em}.leaf{position:absolute;width:12px;height:12px;border-radius:50%;background:#eead66;box-shadow:0 0 12px #eead66}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #c8e47b;padding:9px 14px;color:#c8e47b;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="museum"><p class="label">095 / tree museum / tree walker</p><p class="state" id="state">museum / 0 text nodes catalogued</p><section class="tree" id="tree"><h1>Hello World</h1><span class="leaf"></span><span class="leaf"></span><span class="leaf"></span></section><div class="controls"><button id="scan" type="button">walk the tree</button></div></main><script>
const tree=document.querySelector('#tree'),state=document.querySelector('#state');document.querySelector('#scan').addEventListener('click',()=>{const walker=document.createTreeWalker(tree,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach((node,index)=>{const leaf=tree.querySelectorAll('.leaf')[index];if(leaf){leaf.style.left=`${18+index*30}%`;leaf.style.top=`${30+index*14}%`}});state.textContent=`museum / ${nodes.length} text nodes catalogued by TreeWalker`});
</script></body></html>
