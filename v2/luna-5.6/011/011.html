<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Annotation</title>
  <style>
    :root {
      background: #33263d;
      color: #f4e9ef;
      font-family: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, transparent 0 49.8%, #b7d35a 50% 50.2%, transparent 50.4%),
        #33263d;
    }

    .manuscript {
      width: min(90vw, 1050px);
      padding: 48px 54px 58px;
      border: 1px solid #d9a8c3;
      background: #4a3553;
    }

    .label {
      margin: 0 0 64px;
      color: #b7d35a;
      font: 12px/1.2 monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #f4e9ef;
      font-size: clamp(66px, 14vw, 168px);
      line-height: 0.86;
      letter-spacing: -0.08em;
    }

    ::highlight(greeting-mark) {
      color: #33263d;
      background-color: #b7d35a;
      text-decoration: underline 5px #d9a8c3;
      text-decoration-skip-ink: none;
    }

    .note {
      margin: 58px 0 0;
      color: #d9a8c3;
      font: 13px/1.5 monospace;
    }
  </style>
</head>
<body>
  <main class="manuscript">
    <p class="label">011 / annotation / custom highlight</p>
    <h1 id="greeting">Hello World</h1>
    <p class="note">a registered range paints the first word without changing the DOM</p>
  </main>
  <script>
    const heading = document.querySelector('#greeting');
    const range = new Range();
    range.setStart(heading.firstChild, 0);
    range.setEnd(heading.firstChild, 5);
    const mark = new Highlight(range);
    CSS.highlights.set('greeting-mark', mark);
  </script>
</body>
</html>
