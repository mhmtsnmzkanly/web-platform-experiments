<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Stream</title><style>
:root{font-family:Georgia,serif;color:#f8f4ea;background:#102d2b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#31817a,#102d2b 55%)}.card{width:min(88vw,1080px);padding:48px;border:2px solid #e9b949;background:#123b37;box-shadow:18px 18px 0 #e9b949}p{margin:0 0 50px;color:#e9b949;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(70px,14vw,168px);line-height:.82;letter-spacing:-.08em}.stats{margin-top:48px;color:#a9d8cf;font:14px monospace}</style></head><body><main class="card"><p>022 / stream / reversible payload</p><h1>Hello World</h1><div class="stats">gzip / measuring...</div></main><script>
const text='Hello World', stats=document.querySelector('.stats');
async function measure(){const input=new TextEncoder().encode(text);const compressed=await new Response(new Blob([input]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();const restored=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();stats.textContent=`gzip / ${input.byteLength} bytes → ${compressed.byteLength} bytes → ${restored}`;}
measure();
</script></body></html>
