<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Countermotion</title>
  <style>
    :root {
      background: #f0e8f5;
      color: #30213b;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, transparent 0 49.8%, #a33f7a 50% 50.2%, transparent 50.4%),
        #f0e8f5;
    }

    .frame {
      width: min(90vw, 1080px);
      padding: 38px 46px 44px;
      border: 2px solid #30213b;
      background: #f8f4fa;
    }

    .label {
      margin: 0 0 44px;
      color: #a33f7a;
      font: 12px/1.2 monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 260px;
      margin: 0;
      color: #30213b;
      font-size: clamp(66px, 13vw, 164px);
      line-height: 0.85;
      letter-spacing: -0.09em;
      white-space: nowrap;
      overflow: hidden;
    }

    h1 span {
      display: inline-block;
    }

    h1 span:last-child {
      color: #a33f7a;
    }

    .rule {
      height: 12px;
      margin-top: 44px;
      background: linear-gradient(90deg, #30213b 0 50%, #a33f7a 50% 100%);
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="label">007 / countermotion / native timeline</p>
    <h1><span>Hello </span><span>World</span></h1>
    <div class="rule" aria-hidden="true"></div>
  </main>
  <script>
    const words = document.querySelectorAll('h1 span');
    words[0].animate(
      [
        { transform: 'translateX(-34px) rotate(-4deg)' },
        { transform: 'translateX(0) rotate(0deg)' },
        { transform: 'translateX(34px) rotate(4deg)' },
      ],
      { duration: 2600, direction: 'alternate', iterations: Infinity, easing: 'ease-in-out' },
    );
    words[1].animate(
      [
        { transform: 'translateX(34px) rotate(4deg)' },
        { transform: 'translateX(0) rotate(0deg)' },
        { transform: 'translateX(-34px) rotate(-4deg)' },
      ],
      { duration: 2600, direction: 'alternate', iterations: Infinity, easing: 'ease-in-out' },
    );
  </script>
</body>
</html>
