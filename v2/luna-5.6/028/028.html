<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Pattern</title><style>
:root{font-family:Arial,sans-serif;background:#121826;color:#edf2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#121826,#344b7a)}.card{width:min(88vw,1080px);padding:46px;border:1px solid #a9c4ff;background:#19243a}p{margin:0 0 48px;color:#a9c4ff;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{margin-top:48px;color:#f2b77b;font:14px monospace}</style></head><body><main class="card"><p>028 / urlpattern / route grammar</p><h1>Hello World</h1><div class="state">pattern / testing</div></main><script>
const state=document.querySelector('.state');const path='/hello-world';if(globalThis.URLPattern){const pattern=new URLPattern({pathname:'/:greeting'}),match=pattern.exec({pathname:path});state.textContent=`pattern / ${match.pathname.groups.greeting} matched`;}else{state.textContent='pattern / URLPattern unavailable';}
</script></body></html>
