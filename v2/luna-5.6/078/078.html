<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Memory Window</title>
<style>
:root{color:#eaf6ff;background:#0c1824;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#0c1824,#244e65)}.window{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #8de0d2}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#8de0d2;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#f2c369;font:12px monospace}.pane{position:relative;z-index:1;margin:11vh auto 0;width:min(80vw,920px);padding:28px;border:1px solid #f2c369;background:#123146;min-height:290px}.pane h1{margin:0;font-size:clamp(62px,13vw,158px);line-height:.8;letter-spacing:-.1em}.pane code{display:block;margin-top:34px;color:#8de0d2;font:12px monospace}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:10px}button{border:1px solid #f2c369;padding:9px 14px;color:#f2c369;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="window"><p class="label">078 / memory window / local storage</p><p class="state" id="state">window / no saved inscription</p><section class="pane"><h1>Hello World</h1><code id="saved">storage key: greeting</code></section><div class="controls"><button id="save" type="button">save pane</button><button id="clear" type="button">clear pane</button></div></main><script>
const key='hello-world-078',state=document.querySelector('#state'),saved=document.querySelector('#saved');function read(){const value=localStorage.getItem(key);state.textContent=value?'window / saved inscription restored':'window / storage is empty';saved.textContent=value?`storage key: greeting / ${value}`:'storage key: greeting'}document.querySelector('#save').addEventListener('click',()=>{localStorage.setItem(key,'Hello World');read()});document.querySelector('#clear').addEventListener('click',()=>{localStorage.removeItem(key);read()});read();
</script></body></html>
