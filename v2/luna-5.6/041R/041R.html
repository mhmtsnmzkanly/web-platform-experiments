<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Typed Orbit</title>
<style>
@property --angle{syntax:"<angle>";inherits:false;initial-value:0deg}:root{color:#f5e8ff;background:#1b1226;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#692c72,#1b1226 68%)}.orbit{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #f2a9d0}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#f2a9d0;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#b8f2d2;font:12px monospace}.track{position:relative;z-index:1;margin:14vh auto 0;width:min(64vw,760px);height:min(64vw,760px);max-height:410px;border:1px dashed #b8f2d2;border-radius:50%;animation:turn 8s linear infinite;transform:rotate(var(--angle))}.satellite{position:absolute;top:-13px;left:50%;width:24px;height:24px;border-radius:50%;background:#f2a9d0;box-shadow:0 0 30px #f2a9d0}.track h1{position:absolute;top:42%;left:50%;margin:0;transform:translate(-50%,-50%);white-space:nowrap;animation:counter 8s linear infinite;color:#f5e8ff;font-size:clamp(60px,12vw,150px);line-height:.8;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:12px}button{border:1px solid #f2a9d0;padding:9px 14px;color:#f2a9d0;background:transparent;font:12px monospace;cursor:pointer}@keyframes turn{to{transform:rotate(calc(var(--angle) + 360deg))}}@keyframes counter{to{transform:translate(-50%,-50%) rotate(-360deg)}}</style>
</head><body><main class="orbit"><p class="label">041R / typed orbit / registered property</p><p class="state">--angle / native interpolation</p><section class="track" id="track"><i class="satellite"></i><h1>Hello World</h1></section><div class="controls"><button id="nudge" type="button">nudge orbit</button></div></main><script>
CSS.registerProperty?.({name:'--angle',syntax:'<angle>',inherits:false,initialValue:'0deg'});const track=document.querySelector('#track');document.querySelector('#nudge').addEventListener('click',()=>track.style.setProperty('--angle',`${Math.round(Math.random()*180-90)}deg`));
</script></body></html>
