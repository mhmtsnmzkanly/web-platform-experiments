<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Data Waterfall</title>
<style>
:root{color:#e7fff5;background:#071d1b;font-family:monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 20%,#21675c,#071d1b 62%)}.waterfall{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #e9b949;overflow:hidden}.waterfall:before{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 56px,rgba(233,185,73,.15) 57px),linear-gradient(180deg,transparent,#12473f);content:""}.label,.stats,.controls{position:relative;z-index:1}.label{margin:0;color:#e9b949;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.stats{margin-top:10px;color:#a9d8cf;font-size:12px}.columns{position:relative;z-index:1;display:flex;align-items:end;gap:18px;height:410px;margin:7vh 7% 0}.column{flex:1;height:var(--h);border-top:3px solid #e9b949;background:linear-gradient(#31817a,#123b37);transition:height 500ms ease}.column:nth-child(2n){border-color:#f28b63;background:linear-gradient(#6e3a58,#123b37)}.column b{display:block;padding:12px 8px;color:#e9b949;font-size:12px}.controls{display:flex;align-items:center;gap:16px;margin-top:28px;color:#a9d8cf;font-size:12px}button{border:1px solid #e9b949;padding:9px 14px;color:#e9b949;background:transparent;font:inherit;cursor:pointer}button:hover{background:#e9b949;color:#071d1b}</style>
</head><body><main class="waterfall"><p class="label">022R / data waterfall / reversible payload</p><p class="stats" id="stats">gzip / measuring...</p><section class="columns" id="columns"><div class="column" style="--h:38%"><b>raw</b></div><div class="column" style="--h:62%"><b>gzip</b></div><div class="column" style="--h:48%"><b>restore</b></div><div class="column" style="--h:74%"><b>verified</b></div></section><div class="controls"><button id="run" type="button">run stream</button><span>four stages / one payload</span></div></main><script>
const text='Hello World',stats=document.querySelector('#stats'),columns=[...document.querySelectorAll('.column')];
async function run(){const input=new TextEncoder().encode(text);const compressed=await new Response(new Blob([input]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();const restored=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();stats.textContent=`gzip / ${input.byteLength} bytes → ${compressed.byteLength} bytes → ${restored}`;columns.forEach((column,i)=>column.style.setProperty('--h',`${35+i*14+Math.random()*18}%`))}
document.querySelector('#run').addEventListener('click',run);run();
</script></body></html>
