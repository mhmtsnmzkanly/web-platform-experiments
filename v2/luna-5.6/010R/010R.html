<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World — Responsive Instrument</title>
  <style>
    :root { color: #eff1e8; background: #101613; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; background: linear-gradient(135deg, #101613, #1d2b24); }
    .instrument { width: min(94vw, 1200px); padding: 24px; border: 1px solid #abc56e; background: #152019; }
    .label, .readout { margin: 0; color: #abc56e; font: 11px/1.4 monospace; letter-spacing: .18em; text-transform: uppercase; }
    .readout { color: #d9c46a; letter-spacing: .08em; text-transform: none; }
    .topline { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .viewport { width: 78%; min-height: 500px; margin: 0 auto; container-type: inline-size; overflow: hidden; border: 1px solid #6e8c57; background: #202d25; transition: width 250ms ease; }
    .ruler { height: 28px; border-bottom: 1px solid #6e8c57; background: repeating-linear-gradient(90deg, transparent 0 19px, #6e8c57 20px); }
    .signature { margin: 18px 24px 0; color: #abc56e; font: 11px monospace; letter-spacing: .16em; text-transform: uppercase; }
    .organism { display: grid; grid-template-columns: 1fr 1fr; align-items: center; min-height: 470px; padding: 48px; gap: 24px; }
    .word { margin: 0; font-size: clamp(60px, 12cqw, 150px); line-height: .78; letter-spacing: -.1em; }
    .hello { color: #eff1e8; text-align: right; }
    .world { color: #d9c46a; }
    .marker { grid-column: 1 / -1; height: 2px; background: #d9c46a; transform: scaleX(.62); transform-origin: left; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 18px; color: #b4c1a1; font: 12px monospace; }
    input { width: min(360px, 48vw); accent-color: #d9c46a; }
    @container (max-width: 760px) {
      .organism { grid-template-columns: 1fr; gap: 4px; padding: 38px 28px; }
      .hello { text-align: left; }
      .marker { grid-column: 1; transform: scaleX(.82); }
    }
    @container (max-width: 480px) {
      .viewport { min-height: 400px; }
      .organism { min-height: 370px; padding: 32px 20px; }
      .word { font-size: clamp(52px, 20cqw, 92px); }
    }
  </style>
</head>
<body>
  <main class="instrument">
    <div class="topline">
      <p class="label">010R / responsive instrument / container query</p>
      <p class="readout">container <output id="widthValue">—</output> px</p>
    </div>
    <section class="viewport" id="viewport">
      <div class="ruler" aria-hidden="true"></div>
      <p class="signature">Hello World</p>
      <div class="organism">
        <p class="word hello">Hello</p>
        <p class="word world">World</p>
        <span class="marker" aria-hidden="true"></span>
      </div>
    </section>
    <label class="controls" for="width">change the measured width <input id="width" type="range" min="360" max="1100" value="820"></label>
  </main>
  <script>
    const viewport = document.querySelector('#viewport');
    const width = document.querySelector('#width');
    const widthValue = document.querySelector('#widthValue');
    const resizeObserver = new ResizeObserver(([entry]) => {
      widthValue.value = Math.round(entry.contentRect.width);
    });
    resizeObserver.observe(viewport);
    width.addEventListener('input', () => {
      viewport.style.width = `${width.value}px`;
    });
    viewport.style.width = `${width.value}px`;
  </script>
</body>
</html>
