<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Digest</title>
  <style>
    :root { --ink: #f5f1e8; --accent: #ed7d55; background: #171b24; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #171b24, var(--accent)); }
    .card { width: min(90vw, 1060px); padding: 44px 52px 52px; border: 1px solid var(--accent); background: color-mix(in srgb, #171b24 82%, var(--accent)); }
    .label { margin: 0 0 52px; color: var(--accent); font: 12px/1.2 monospace; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--ink); font-size: clamp(72px, 15vw, 176px); line-height: .82; letter-spacing: -.1em; }
    .hash { margin: 48px 0 0; color: var(--accent); font: 13px/1.5 monospace; word-break: break-all; }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">020 / digest / color identity</p>
    <h1>Hello World</h1>
    <p class="hash">sha-256 / pending</p>
  </main>
  <script>
    const text = 'Hello World';
    const hashLabel = document.querySelector('.hash');
    const bytes = new TextEncoder().encode(text);
    crypto.subtle.digest('SHA-256', bytes).then((buffer) => {
      const hex = [...new Uint8Array(buffer)].map((value) => value.toString(16).padStart(2, '0')).join('');
      const accent = `#${hex.slice(0, 6)}`;
      const ink = `#${hex.slice(6, 12)}`;
      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--ink', ink);
      hashLabel.textContent = `sha-256 / ${hex}`;
    });
  </script>
</body>
</html>
