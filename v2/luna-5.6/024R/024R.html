<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Threshold Canyon</title>
<style>
:root{color:#241d18;background:#e8e0d0;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:220vh;background:linear-gradient(#e8e0d0 0 48%,#b85c45 100%)}.canyon{position:fixed;inset:0;display:grid;place-items:center}.walls{position:absolute;inset:0;overflow:hidden}.wall{position:absolute;top:-10%;width:44vw;height:130%;background:#8f493e;transform:skewY(18deg)}.wall:first-child{left:-14%}.wall:last-child{right:-14%;transform:skewY(-18deg);background:#c67c55}.marker{position:relative;z-index:1;width:min(78vw,900px);padding:28px;border:1px solid #241d18;background:#f4ebd8;opacity:.25;transform:translateY(18px);transition:.6s ease}.marker.seen{opacity:1;transform:none;box-shadow:14px 14px 0 #241d18}.label{margin:0 0 28px;color:#b85c45;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}h1{margin:0;font-size:clamp(68px,14vw,170px);line-height:.8;letter-spacing:-.1em}.state{margin:30px 0 0;font:13px monospace}.guide{position:absolute;bottom:7vh;left:50%;width:1px;height:12vh;background:#241d18}</style>
</head><body><main class="canyon"><div class="walls"><i class="wall"></i><i class="wall"></i></div><section class="marker"><p class="label">024R / threshold canyon / intersection observer</p><h1>Hello World</h1><p class="state" id="state">observer / below the threshold</p></section><i class="guide"></i></main><script>
const marker=document.querySelector('.marker'),state=document.querySelector('#state');new IntersectionObserver(([entry])=>{marker.classList.toggle('seen',entry.isIntersecting);state.textContent=`observer / ${Math.round(entry.intersectionRatio*100)}% threshold contact`},{threshold:[.5]}).observe(marker);
</script></body></html>
