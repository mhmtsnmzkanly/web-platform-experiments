<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Pointer</title><style>
:root{font-family:system-ui;background:#111c1d;color:#eaffff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#111c1d,#2c7879)}main{width:min(90vw,1080px);padding:46px;border:1px solid #8ee8e3;background:#173b3b}p{color:#8ee8e3;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#ffd273;font:14px monospace}</style><main><p>070 / pointer media / input surface</p><h1>Hello World</h1><div class="state">pointer / reading</div></main><script>
