<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Laser Measure</title>
<style>
:root{color:#f3f1e5;background:#101a20;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101a20,#194b54)}.measure{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #e58f61}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#e58f61;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#9ee4db;font:12px monospace}.ruler{position:relative;z-index:1;margin:14vh auto 0;width:min(76vw,900px);padding:30px 0;border-block:1px solid #e58f61}.ruler h1{margin:0;text-align:center;font-size:clamp(64px,13vw,158px);line-height:.8;letter-spacing:-.1em}.laser{position:absolute;left:10%;right:10%;height:2px;background:#e58f61;box-shadow:0 0 20px #e58f61;transition:top .3s}.controls{position:absolute;right:28px;bottom:28px;display:flex;align-items:center;gap:12px}input{width:220px;accent-color:#e58f61}</style>
</head><body><main class="measure"><p class="label">054R / laser measure / range geometry</p><p class="state" id="state">range / waiting for a measurement</p><section class="ruler" id="ruler"><h1 id="greeting">Hello World</h1><i class="laser" id="laser"></i></section><div class="controls"><label for="depth">scan line <input id="depth" type="range" min="0" max="100" value="50"></label></div></main><script>
const ruler=document.querySelector('#ruler'),greeting=document.querySelector('#greeting'),laser=document.querySelector('#laser'),state=document.querySelector('#state'),depth=document.querySelector('#depth');function measure(){const range=new Range();range.selectNodeContents(greeting);const box=range.getBoundingClientRect(),parent=ruler.getBoundingClientRect();laser.style.top=`${(box.top-parent.top)+Number(depth.value)-50}px`;state.textContent=`range / ${Math.round(box.width)}×${Math.round(box.height)} px / measured`}depth.addEventListener('input',measure);measure();
</script></body></html>
