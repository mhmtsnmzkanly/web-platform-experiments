<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Blob URL</title><style>
:root{font-family:Arial;background:#111b1b;color:#eafff8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#111b1b,#2d7668)}main{width:min(90vw,1080px);padding:46px;border:1px solid #89e8ce;background:#17352f}p{color:#89e8ce;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#ffd170;font:14px monospace}</style><main><p>059 / blob url / local object</p><h1>Hello World</h1><div class="state">blob / opening</div></main><script>
const s=document.querySelector('.state'),blob=new Blob(['Hello World'],{type:'text/plain'});blob.text().then(t=>{s.textContent=`blob / ${t} / local text read`}).catch(()=>s.textContent='blob / unavailable');
</script>
