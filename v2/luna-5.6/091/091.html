<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Typed Blueprint</title>
<style>
:root{color:#ecf5ff;background:#121c2c;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#121c2c,#395d7b)}.blueprint{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #8dd6dd;background-image:linear-gradient(rgba(141,214,221,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(141,214,221,.1) 1px,transparent 1px);background-size:32px 32px}.label,.state,.controls{position:relative;z-index:2}.label{margin:0;color:#8dd6dd;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#f0c26d;font:12px monospace}.sheet{position:relative;z-index:1;margin:11vh auto 0;width:min(76vw,880px);height:300px;border:1px solid #f0c26d;display:grid;place-items:center;transform:rotate(-3deg);transition:transform .3s}.sheet h1{margin:0;color:#f4f0dc;font-size:clamp(60px,12vw,145px);line-height:.8;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:10px}input{width:150px;accent-color:#f0c26d}</style>
</head><body><main class="blueprint"><p class="label">091 / typed blueprint / css typed om</p><p class="state" id="state">blueprint / set a typed angle</p><section class="sheet" id="sheet"><h1>Hello World</h1></section><div class="controls"><label for="angle">angle <input id="angle" type="range" min="-18" max="18" value="-3"></label></div></main><script>
const sheet=document.querySelector('#sheet'),angle=document.querySelector('#angle'),state=document.querySelector('#state');function turn(){const value=Number(angle.value);if(sheet.attributeStyleMap){sheet.attributeStyleMap.set('transform',new CSSTransformValue([new CSSRotate(CSS.deg(value))]));state.textContent=`blueprint / typed CSSRotate ${value}°`}else{sheet.style.transform=`rotate(${value}deg)`;state.textContent='blueprint / CSS Typed OM unavailable / fallback transform'}}angle.addEventListener('input',turn);turn();
</script></body></html>
