<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Glass</title>
  <style>
    :root {
      background: #10142c;
      color: #f7f2e8;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 28%, #d45c87 0 11%, transparent 12%),
        radial-gradient(circle at 78% 68%, #4e86d9 0 16%, transparent 17%),
        radial-gradient(circle at 65% 20%, #e5b657 0 8%, transparent 9%),
        #10142c;
    }

    .orb {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(2px);
      background: #72d1b3;
      transform: translate(-270px, 170px);
    }

    .glass {
      position: relative;
      width: min(90vw, 1080px);
      padding: 42px 52px 54px;
      border: 1px solid rgba(255, 255, 255, 0.66);
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
    }

    .label {
      margin: 0 0 54px;
      color: #f4c8dc;
      font: 12px/1.2 monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #f7f2e8;
      font-size: clamp(70px, 14vw, 170px);
      line-height: 0.82;
      letter-spacing: -0.1em;
      text-shadow: 0 3px 24px rgba(16, 20, 44, 0.35);
    }

    .note {
      margin: 50px 0 0;
      color: #d7e8ff;
      font: 13px/1.5 monospace;
    }
  </style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div>
  <main class="glass">
    <p class="label">017 / glass / backdrop blur</p>
    <h1>Hello World</h1>
    <p class="note">the surface changes what the greeting sees behind it</p>
  </main>
</body>
</html>
