<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello World — Mutation</title><style>
:root{font-family:ui-monospace,monospace;background:#181818;color:#f2f0e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#181818}.card{width:min(88vw,1080px);padding:44px;border:1px solid #8ee3c2;background:#232323}p{margin:0 0 48px;color:#8ee3c2;font-size:12px;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font:700 clamp(64px,13vw,158px)/.82 ui-monospace,monospace;letter-spacing:-.12em}.trace{margin-top:48px;color:#f0b35b;font-size:14px}.pulse{animation:pulse .45s ease}@keyframes pulse{50%{color:#fff;transform:translateX(10px)}}</style></head><body><main class="card"><p>025 / mutation / native change log</p><h1>Hello World</h1><div class="trace">mutations / 0</div></main><script>
const card=document.querySelector('.card'),trace=document.querySelector('.trace');let count=0;new MutationObserver((records)=>{count+=records.length;trace.textContent=`mutations / ${count} / observed`;trace.classList.remove('pulse');void trace.offsetWidth;trace.classList.add('pulse')}).observe(card,{attributes:true,subtree:true,attributeFilter:['data-phase','data-ready']});requestAnimationFrame(()=>{card.dataset.phase='painted';trace.textContent='mutations / waiting';setTimeout(()=>{card.querySelector('h1').dataset.ready='true'},40)});
</script></body></html>
