<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Lock Chamber</title>
<style>
:root{color:#f5f0da;background:#111722;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#3c5670,#111722 68%)}.chamber{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #e7bb62}.label,.state,.controls{position:relative;z-index:1}.label{margin:0;color:#e7bb62;font:11px monospace;letter-spacing:.18em;text-transform:uppercase}.state{margin-top:10px;color:#b7cce0;font:12px monospace}.door{position:relative;z-index:1;margin:11vh auto 0;width:min(74vw,820px);padding:36px;border:8px solid #314a63;background:#1a2736;box-shadow:inset 0 0 0 1px #e7bb62}.door h1{margin:0;font-size:clamp(64px,13vw,156px);line-height:.8;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px;display:flex;gap:12px}button{border:1px solid #e7bb62;padding:9px 14px;color:#e7bb62;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="chamber"><p class="label">038R / lock chamber / web locks</p><p class="state" id="state">lock / door open</p><section class="door"><h1>Hello World</h1></section><div class="controls"><button id="queue" type="button">queue visitor</button><button id="release" type="button">release lock</button></div></main><script>
const state=document.querySelector('#state');let releaseCurrent=null;document.querySelector('#queue').addEventListener('click',()=>{state.textContent='lock / visitor waiting';navigator.locks?.request('hello-world-038r',async lock=>{state.textContent='lock / visitor inside';await new Promise(resolve=>{releaseCurrent=resolve});state.textContent='lock / visitor departed'})});document.querySelector('#release').addEventListener('click',()=>{releaseCurrent?.();releaseCurrent=null});
</script></body></html>
