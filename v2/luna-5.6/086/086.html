<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World — Bitmap Greenhouse</title>
<style>
:root{color:#eff9e6;background:#17251b;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#17251b,#47764b)}.greenhouse{position:relative;width:min(94vw,1180px);min-height:min(84vh,680px);padding:28px;border:1px solid #cce57a}.label,.state,.controls{position:relative;z-index:2}.label{margin:0;color:#cce57a;font:11px monospace;letter-spacing:.18em}.state{margin-top:10px;color:#bddbb2;font:12px monospace}.glass{position:relative;z-index:1;margin:9vh auto 0;width:min(78vw,900px);height:360px;border:1px solid #cce57a;background:rgba(20,55,35,.5);display:grid;place-items:center;overflow:hidden}.glass canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.3}.glass h1{position:relative;margin:0;color:#f3f0da;font-size:clamp(60px,13vw,156px);line-height:.8;letter-spacing:-.1em}.controls{position:absolute;right:28px;bottom:28px}button{border:1px solid #cce57a;padding:9px 14px;color:#cce57a;background:transparent;font:12px monospace;cursor:pointer}</style>
</head><body><main class="greenhouse"><p class="label">086 / bitmap greenhouse / image bitmap</p><p class="state" id="state">greenhouse / canvas seed waiting</p><section class="glass"><canvas id="seed" width="900" height="360"></canvas><h1>Hello World</h1></section><div class="controls"><button id="grow" type="button">grow bitmap</button></div></main><script>
const canvas=document.querySelector('#seed'),ctx=canvas.getContext('2d'),state=document.querySelector('#state');ctx.fillStyle='#8fd18e';ctx.fillRect(0,0,900,360);ctx.fillStyle='#f0c66b';for(let i=0;i<18;i++){ctx.beginPath();ctx.arc(50+i*48,250-(i%4)*35,14+i%6*5,0,Math.PI*2);ctx.fill()}document.querySelector('#grow').addEventListener('click',async()=>{const blob=await new Promise(resolve=>canvas.toBlob(resolve));const bitmap=await createImageBitmap(blob);ctx.clearRect(0,0,900,360);ctx.globalAlpha=.35;ctx.drawImage(bitmap,0,0);ctx.globalAlpha=1;bitmap.close();state.textContent='greenhouse / ImageBitmap grown and painted back'});
</script></body></html>
