<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hello World — Point</title><style>
:root{font-family:system-ui;background:#21170f;color:#fff1d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#8c552d,#21170f 70%)}main{width:min(90vw,1080px);padding:46px;border:1px solid #ffc26d;background:#352015}p{color:#ffc26d;font:12px monospace;letter-spacing:.2em;text-transform:uppercase}h1{margin:45px 0;font-size:clamp(72px,15vw,178px);line-height:.8;letter-spacing:-.1em}.state{color:#b6f0cf;font:14px monospace}</style><main id="card"><p>052 / elementfrompoint / hit testing</p><h1>Hello World</h1><div class="state">point / locating</div></main><script>
